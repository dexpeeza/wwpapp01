<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maintenance Report Pro A4</title>
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- HTML2PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f1f5f9;
    }

    /* การตั้งค่าหน้ากระดาษ A4 มาตรฐาน */
    .a4-page {
      background: white;
      margin: 0 auto 24px auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
      position: relative;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .a4-portrait {
      width: 210mm;
      height: 297mm;
      padding: 10mm 12mm;
    }

    .a4-landscape {
      width: 297mm;
      height: 210mm;
      padding: 10mm 12mm;
    }

    /* ย่อขนาดกระดาษให้พอดีกับหน้าจอมือถือขณะดูตัวอย่าง */
    @media screen and (max-width: 820px) {
      .a4-preview-wrapper {
        overflow-x: auto;
        padding-bottom: 16px;
      }
      .a4-portrait {
        zoom: 0.44;
      }
      .a4-landscape {
        zoom: 0.32;
      }
    }

    /* กรอบรูปภาพอยู่ตรงกลางสวยๆ */
    .photo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed #94a3b8;
      background-color: #f8fafc;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
      border-radius: 4px;
    }
    .photo-box.has-img {
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: center;
      object-position: center;
      object-fit: cover;
      display: block;
    }

    /* ซ่อนปุ่มควบคุมเวลาสั่งปริ้นหรือเซฟ PDF */
    @media print {
      body {
        background: white;
        margin: 0;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .a4-page {
        margin: 0 !important;
        box-shadow: none !important;
        zoom: 1 !important;
      }
    }
  </style>
</head>
<body class="pb-24">

  <!-- แถบเมนูด้านบน (เหมาะกับจอมือถือ) -->
  <header class="bg-blue-900 text-white sticky top-0 z-40 shadow-md no-print">
    <div class="max-w-7xl mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-screwdriver-wrench text-yellow-400 text-xl"></i>
        <div>
          <h1 class="font-bold text-base leading-tight">Maintenance A4 Pro</h1>
          <p class="text-[11px] text-blue-200">ระบบรายงานซ่อมบำรุง & จัดเรียงรูปมาตรฐาน A4</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 flex-wrap">
        <button id="btnInstall" onclick="installPWA()" class="hidden bg-yellow-500 hover:bg-yellow-600 text-black text-xs font-bold px-2.5 py-1.5 rounded flex items-center gap-1">
          <i class="fa-solid fa-mobile-screen-button"></i> ติดตั้งแอป
        </button>
        <button onclick="openCameraModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded flex items-center gap-1">
          <i class="fa-solid fa-camera"></i> ถ่ายรูป
        </button>
        <button onclick="openHistoryModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded flex items-center gap-1">
          <i class="fa-solid fa-table-list"></i> ตรวจสอบข้อมูล
        </button>
        <button onclick="openConfigModal()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-2.5 py-1.5 rounded" title="ตั้งค่า Google Sheet">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- แผงควบคุมหลัก (ซ่อนเวลาปริ้น) -->
  <section class="max-w-7xl mx-auto p-3 no-print">
    <div class="bg-white rounded-xl shadow p-4 border border-slate-200 space-y-4">
      
      <!-- แถวที่ 1: สถานะงาน & ข้อมูลหลัก -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">สถานะใบงาน</label>
          <select id="jobStatus" onchange="syncHeaderInfo()" class="w-full border rounded-lg px-2.5 py-1.5 text-sm font-semibold bg-emerald-50 text-emerald-800 border-emerald-300">
            <option value="เปิดงาน (Open Job)">🟢 เปิดงาน (Open Job)</option>
            <option value="กำลังดำเนินการ (In Progress)">🟡 กำลังดำเนินการ</option>
            <option value="ปิดงาน (Closed Job)">🔵 ปิดงาน (Closed Job)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">รหัสเครื่องจักร (Machine ID)</label>
          <input type="text" id="machineCode" oninput="syncHeaderInfo()" placeholder="เช่น MTR-BLW-001" class="w-full border rounded-lg px-2.5 py-1.5 text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">วันที่เข้าทำ (Date)</label>
          <input type="date" id="jobDate" onchange="syncHeaderInfo()" class="w-full border rounded-lg px-2.5 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ผู้ปฏิบัติงาน (Technician)</label>
          <input type="text" id="techName" oninput="syncHeaderInfo()" placeholder="ชื่อช่าง / ทีมงาน" class="w-full border rounded-lg px-2.5 py-1.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">โฟลเดอร์จัดเก็บงาน</label>
          <input type="text" id="folderName" placeholder="เช่น PM_Motor_2026" class="w-full border rounded-lg px-2.5 py-1.5 text-sm">
        </div>
      </div>

      <!-- แถวที่ 2: การตั้งค่าหน้ากระดาษ A4 และขนาดรูป -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 pt-2 border-t border-slate-100">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">แนวกระดาษ A4</label>
          <select id="pageOrientation" onchange="updateLayoutSettings()" class="w-full border rounded-lg px-2.5 py-1.5 text-sm bg-slate-50">
            <option value="portrait">แนวตั้ง (Portrait)</option>
            <option value="landscape">แนวนอน (Landscape)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">จำนวนรูปต่อหน้า A4</label>
          <select id="photosPerPage" onchange="updateLayoutSettings()" class="w-full border rounded-lg px-2.5 py-1.5 text-sm bg-slate-50">
            <option value="4">4 รูป / หน้า (2x2)</option>
            <option value="6" selected>6 รูป / หน้า (2x3)</option>
            <option value="8">8 รูป / หน้า (2x4)</option>
            <option value="12">12 รูป / หน้า (3x4)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ปรับขนาดกรอบรูปภาพ (ซม.)</label>
          <select id="photoSizeCm" onchange="updateLayoutSettings()" class="w-full border rounded-lg px-2.5 py-1.5 text-sm bg-slate-50">
            <option value="4">4 x 4 ซม.</option>
            <option value="5">5 x 5 ซม.</option>
            <option value="6" selected>6 x 6 ซม.</option>
            <option value="7">7 x 7 ซม.</option>
            <option value="8">8 x 8 ซม.</option>
            <option value="9">9 x 9 ซม.</option>
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="addNewPagePrompt()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-3 rounded-lg text-sm flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-file-circle-plus"></i> เพิ่มหน้ากระดาษ A4
          </button>
        </div>
      </div>

      <!-- แถวที่ 3: เลือกหัวข้อหลัก 1 - 7 (แยกสัดส่วนชัดเจน ไม่ปนกัน) -->
      <div class="pt-2 border-t border-slate-100">
        <label class="block text-xs font-bold text-blue-900 mb-2">
          <i class="fa-solid fa-layer-group"></i> เลือกหัวข้อที่ต้องการเพิ่มหน้ากระดาษ หรือจัดการข้อมูล (แยกสัดส่วน 1 - 7 ไม่ปนกัน):
        </label>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
          <button onclick="createSectionPage(1)" class="text-left text-xs p-2 rounded-lg border border-blue-200 bg-blue-50 hover:bg-blue-100 font-semibold text-blue-900 flex items-center justify-between">
            <span>1. OVERHAUL MOTOR (ก่อนทำ/หลังทำ)</span>
            <i class="fa-solid fa-plus-circle text-blue-600"></i>
          </button>
          <button onclick="createSectionPage(2)" class="text-left text-xs p-2 rounded-lg border border-blue-200 bg-blue-50 hover:bg-blue-100 font-semibold text-blue-900 flex items-center justify-between">
            <span>2. OVERHAUL BLOWER (ก่อนทำ/หลังทำ)</span>
            <i class="fa-solid fa-plus-circle text-blue-600"></i>
          </button>
          <button onclick="createSectionPage(3)" class="text-left text-xs p-2 rounded-lg border border-blue-200 bg-blue-50 hover:bg-blue-100 font-semibold text-blue-900 flex items-center justify-between">
            <span>3. เปลี่ยนสายพาน & Alignment Laser</span>
            <i class="fa-solid fa-plus-circle text-blue-600"></i>
          </button>
          <button onclick="createSectionPage(4)" class="text-left text-xs p-2 rounded-lg border border-blue-200 bg-blue-50 hover:bg-blue-100 font-semibold text-blue-900 flex items-center justify-between">
            <span>4. CLEANING (ก่อนทำ/หลังทำ)</span>
            <i class="fa-solid fa-plus-circle text-blue-600"></i>
          </button>
          <button onclick="createSectionPage(5)" class="text-left text-xs p-2 rounded-lg border border-blue-200 bg-blue-50 hover:bg-blue-100 font-semibold text-blue-900 flex items-center justify-between">
            <span>5. PM (Preventive Maintenance)</span>
            <i class="fa-solid fa-plus-circle text-blue-600"></i>
          </button>
          <button onclick="createSectionPage(6)" class="text-left text-xs p-2 rounded-lg border border-amber-300 bg-amber-50 hover:bg-amber-100 font-semibold text-amber-900 flex items-center justify-between">
            <span>6. วัดความร้อน (°C) & Vibration (mm/s)</span>
            <i class="fa-solid fa-plus-circle text-amber-600"></i>
          </button>
          <button onclick="createSectionPage(7)" class="text-left text-xs p-2 rounded-lg border border-purple-300 bg-purple-50 hover:bg-purple-100 font-semibold text-purple-900 flex items-center justify-between sm:col-span-2">
            <span>7. ข้อเสนอแนะ Comment / Alarm Code & เพิ่มหัวข้ออิสระ</span>
            <i class="fa-solid fa-plus-circle text-purple-600"></i>
          </button>
        </div>
      </div>

    </div>
  </section>

  <!-- พื้นที่แสดงกระดาษ A4 ทั้งหมด -->
  <main class="a4-preview-wrapper px-2">
    <div id="documentContainer"></div>
  </main>

  <!-- แถบเครื่องมือด้านล่างสำหรับมือถือ (บันทึก / ปริ้น / ส่งออก PDF, WORD, Google Sheet) -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-300 shadow-lg z-40 no-print">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between gap-2 overflow-x-auto">
      <button onclick="saveToGoogleSheet()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 shrink-0 shadow">
        <i class="fa-solid fa-cloud-arrow-up"></i> บันทึก Google Sheet
      </button>
      <button onclick="exportToPDF()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 shrink-0 shadow">
        <i class="fa-solid fa-file-pdf"></i> บันทึก .PDF
      </button>
      <button onclick="exportToWord()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 shrink-0 shadow">
        <i class="fa-solid fa-file-word"></i> บันทึก .WORD
      </button>
      <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 shrink-0 shadow">
        <i class="fa-solid fa-print"></i> ปริ้นงาน / ปิดงาน
      </button>
    </div>
  </footer>

  <!-- Input ซ่อนสำหรับอัปโหลดหลายรูปพร้อมกัน -->
  <input type="file" id="multiPhotoInput" accept="image/*" multiple class="hidden" onchange="handleMultiFilesSelected(event)">
  <input type="file" id="singlePhotoInput" accept="image/*" class="hidden" onchange="handleSingleFileSelected(event)">

  <!-- Modal กล้องถ่ายรูป (พร้อมปุ่มสลับกล้อง หน้า-หลัง) -->
  <div id="cameraModal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-3 no-print">
    <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
      <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between">
        <span class="font-bold text-sm"><i class="fa-solid fa-camera mr-1"></i> ถ่ายรูปหน้างาน</span>
        <button onclick="closeCameraModal()" class="text-slate-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-3 bg-black flex flex-col items-center">
        <video id="cameraVideo" autoplay playsinline class="w-full h-64 object-cover rounded-lg bg-slate-800"></video>
        <canvas id="cameraCanvas" class="hidden"></canvas>
      </div>
      <div class="p-3 bg-slate-100 flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <label class="text-xs font-bold text-slate-700 shrink-0">ใส่ในหน้า:</label>
          <select id="cameraTargetPage" class="w-full border rounded px-2 py-1 text-xs bg-white"></select>
        </div>
        <div class="flex items-center justify-between gap-2 pt-1">
          <button onclick="switchCamera()" class="bg-slate-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1">
            <i class="fa-solid fa-camera-rotate"></i> สลับกล้อง
          </button>
          <button onclick="capturePhotoFromStream()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2 rounded-lg flex items-center justify-center gap-1">
            <i class="fa-solid fa-circle-dot"></i> กดถ่ายรูปเข้าตาราง
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal ตรวจสอบข้อมูลที่บันทึกไว้ (LocalStorage & Google Sheet) -->
  <div id="historyModal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-3 no-print">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="bg-indigo-900 text-white px-4 py-3 flex items-center justify-between">
        <span class="font-bold text-sm"><i class="fa-solid fa-database mr-1"></i> ตรวจสอบข้อมูลที่บันทึกไว้</span>
        <button onclick="closeHistoryModal()" class="text-indigo-200 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-4 overflow-y-auto flex-1 space-y-3" id="historyListContainer">
        <!-- รายการบันทึกจะแสดงที่นี่ -->
      </div>
      <div class="p-3 bg-slate-100 border-t flex justify-between items-center">
        <span class="text-xs text-slate-500">ข้อมูลถูกสำรองทั้งในเครื่องและส่งไปยัง Google Sheet</span>
        <button onclick="closeHistoryModal()" class="bg-slate-700 text-white text-xs px-4 py-1.5 rounded-lg">ปิดหน้าต่าง</button>
      </div>
    </div>
  </div>

  <!-- Modal ตั้งค่า URL ของ Google Apps Script -->
  <div id="configModal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-3 no-print">
    <div class="bg-white rounded-2xl max-w-md w-full p-4 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-link text-blue-600"></i> ตั้งค่าการเชื่อมต่อ Google Sheet</h3>
        <button onclick="closeConfigModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Google Apps Script Web App URL:</label>
        <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border rounded-lg px-3 py-2 text-xs">
        <p class="text-[11px] text-slate-500 mt-1">นำ URL ที่ได้จากการ Deploy โค้ด Google Apps Script (ส่วนที่ 2) มาวางที่นี่</p>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="saveConfigUrl()" class="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-lg">บันทึกการตั้งค่า</button>
      </div>
    </div>
  </div>

  <script>
    // ข้อมูลโครงสร้างหัวข้อ 1 - 7 แยกสัดส่วนชัดเจน
    const SECTION_DEFINITIONS = {
      1: { code: "SEC-01", title: "1. OVERHAUL MOTOR (ก่อนทำ - หลังทำ)", type: "before_after" },
      2: { code: "SEC-02", title: "2. OVERHAUL BLOWER (ก่อนทำ - หลังทำ)", type: "before_after" },
      3: { code: "SEC-03", title: "3. เปลี่ยนสายพาน และ ตั้ง Alignment Laser (ก่อนทำ - หลังทำ)", type: "before_after" },
      4: { code: "SEC-04", title: "4. CLEANING (ก่อนทำ - หลังทำ)", type: "before_after" },
      5: { code: "SEC-05", title: "5. PM (Preventive Maintenance)", type: "pm_photo" },
      6: { code: "SEC-06", title: "6. วัดค่าความร้อน Temperature (°C) 3 ค่า & ความสั่นสะเทือน Vibration (mm/s) 3 ค่า", type: "measurement_photo" },
      7: { code: "SEC-07", title: "7. ข้อเสนอแนะ Comment / Alarm Code และหัวข้อเพิ่มเติม", type: "comment_photo" }
    };

    let pagesData = [];
    let activePageIdForMultiUpload = null;
    let activeSlotForSingleUpload = { pageId: null, slotIndex: null };
    let cameraStream = null;
    let currentFacingMode = "environment"; // เริ่มที่กล้องหลัง
    let deferredPrompt = null;

    // เริ่มต้นระบบเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('jobDate').valueAsDate = new Date();
      const savedUrl = localStorage.getItem('GAS_WEB_APP_URL');
      if (savedUrl) document.getElementById('gasUrlInput').value = savedUrl;

      // สร้างหน้าเริ่มต้นให้ครบทั้ง 7 หมวดหมู่ (แยกหน้ากันชัดเจน ไม่ปนกัน)
      for (let s = 1; s <= 7; s++) {
        createSectionPage(s, false);
      }
      renderAllPages();
    });

    // รองรับการกดติดตั้งแอปลงโทรศัพท์ (PWA)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('btnInstall').classList.remove('hidden');
    });

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      } else {
        alert("วิธีติดตั้งแอปลงมือถือ:\n- Safari (iOS): กดปุ่มแชร์ (Share) > เลือก 'เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)'\n- Chrome (Android): กดเมนูมุมขวาบน (จุด 3 จุด) > เลือก 'ติดตั้งแอป' หรือ 'เพิ่มลงในหน้าจอหลัก'");
      }
    }

    // สร้างข้อมูลหน้ากระดาษใหม่ตามหัวข้อ 1-7
    function createSectionPage(sectionNum, shouldRender = true) {
      const def = SECTION_DEFINITIONS[sectionNum];
      const count = parseInt(document.getElementById('photosPerPage').value, 10);
      const pageId = 'PAGE-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

      const slots = [];
      for (let i = 0; i < count; i++) {
        let defaultTag = `รูปที่ ${i + 1}`;
        if (def.type === 'before_after') {
          defaultTag = (i % 2 === 0) ? `ก่อนทำ (Before) #${Math.floor(i/2)+1}` : `หลังทำ (After) #${Math.floor(i/2)+1}`;
        }
        slots.push({
          image: null,
          tag: defaultTag,
          notes: [""] // รองรับการเพิ่มหมายเหตุใต้รูปภาพได้หลายบรรทัด/หลายครั้ง
        });
      }

      const newPage = {
        id: pageId,
        sectionNum: sectionNum,
        sectionTitle: def.title,
        customSubHeader: "",
        slots: slots,
        // ข้อมูลเฉพาะของหัวข้อที่ 6 (Temperature 3 ค่า / Vibration 3 ค่า)
        measurements: {
          temp1: "", temp2: "", temp3: "",
          vib1: "", vib2: "", vib3: ""
        },
        // ข้อมูลเฉพาะของหัวข้อที่ 7 (Comment / Alarm Code)
        alarmData: {
          alarmCode: "",
          comment: "",
          extraTopic: ""
        },
        pageFooterNote: ""
      };

      pagesData.push(newPage);
      if (shouldRender) renderAllPages();
    }

    function addNewPagePrompt() {
      const choice = prompt(
        "พิมพ์หมายเลขหัวข้อ (1 - 7) ที่ต้องการเพิ่มหน้ากระดาษ A4:\n" +
        "1 = OVERHAUL MOTOR (ก่อนทำ/หลังทำ)\n" +
        "2 = OVERHAUL BLOWER (ก่อนทำ/หลังทำ)\n" +
        "3 = เปลี่ยนสายพาน & Alignment Laser\n" +
        "4 = CLEANING (ก่อนทำ/หลังทำ)\n" +
        "5 = PM\n" +
        "6 = วัดค่าความร้อน 3 ค่า & ความสั่นสะเทือน 3 ค่า\n" +
        "7 = ข้อเสนอแนะ Comment / Alarm Code", "1"
      );
      const num = parseInt(choice, 10);
      if (num >= 1 && num <= 7) {
        createSectionPage(num, true);
      }
    }

    // ปรับจำนวนช่องตาราง (4, 6, 8, 12) หรือขนาดรูป (4x4 ถึง 9x9 ซม.)
    function updateLayoutSettings() {
      const targetCount = parseInt(document.getElementById('photosPerPage').value, 10);
      pagesData.forEach(page => {
        const def = SECTION_DEFINITIONS[page.sectionNum];
        while (page.slots.length < targetCount) {
          const idx = page.slots.length;
          let defaultTag = `รูปที่ ${idx + 1}`;
          if (def.type === 'before_after') {
            defaultTag = (idx % 2 === 0) ? `ก่อนทำ (Before) #${Math.floor(idx/2)+1}` : `หลังทำ (After) #${Math.floor(idx/2)+1}`;
          }
          page.slots.push({ image: null, tag: defaultTag, notes: [""] });
        }
        if (page.slots.length > targetCount) {
          page.slots = page.slots.slice(0, targetCount);
        }
      });
      renderAllPages();
    }

    function syncHeaderInfo() {
      renderAllPages();
    }

    // คำนวณ Grid Columns ตามจำนวนรูป (4, 6, 8, 12) และแนวกระดาษ
    function getGridClass(count, orientation) {
      if (count === 4) return "grid-cols-2";
      if (count === 6) return orientation === "landscape" ? "grid-cols-3" : "grid-cols-2";
      if (count === 8) return orientation === "landscape" ? "grid-cols-4" : "grid-cols-2";
      if (count === 12) return orientation === "landscape" ? "grid-cols-4" : "grid-cols-3";
      return "grid-cols-2";
    }

    // วาดหน้ากระดาษ A4 ทั้งหมด
    function renderAllPages() {
      const container = document.getElementById('documentContainer');
      container.innerHTML = '';

      const orientation = document.getElementById('pageOrientation').value;
      const photoSizeCm = parseInt(document.getElementById('photoSizeCm').value, 10);
      const photosPerPage = parseInt(document.getElementById('photosPerPage').value, 10);

      const jobStatus = document.getElementById('jobStatus').value;
      const machineCode = document.getElementById('machineCode').value || "-";
      const jobDate = document.getElementById('jobDate').value || "-";
      const techName = document.getElementById('techName').value || "-";

      pagesData.forEach((page, pageIndex) => {

        pageEl.className = `a4-page ${orientation === 'landscape' ? 'a4-landscape' : 'a4-portrait'}`;

        // ส่วนหัวกระดาษ A4 (แยกตามหมวดหมู่ 1-7 ชัดเจน)
        const headerHtml = `
          <div>

            <div class="no-print bg-slate-800 text-white px-3 py-1.5 rounded-t-lg mb-2 flex flex-wrap items-center justify-between gap-2 text-xs">

                </button>
                <button onclick="duplicateSectionPage(${pageIndex})" class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded" title="เพิ่มหน้าในหมวดนี้">
                  <i class="fa-solid fa-copy"></i> เพิ่มหน้าหมวดนี้
                </button>
                ${pagesData.length > 1 ? `
                <button onclick="removePage('${page.id}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded" title="ลบหน้านี้">
                  <i class="fa-solid fa-trash"></i>
                </button>` : ''}
              </div>
            </div>

            <!-- กรอบหัวกระดาษมาตรฐานวิศวกรรม -->

        // ส่วนตารางรูปภาพ จัดกึ่งกลางสวยงาม
        const gridColsClass = getGridClass(photosPerPage, orientation);
        let slotsHtml = `<div class="grid ${gridColsClass} gap-2 my-auto py-1">`;

        page.slots.forEach((slot, slotIdx) => {
          const notesInputsHtml = slot.notes.map((n, nIdx) => `
            <div class="flex items-center gap-1 mt-0.5">
              <input type="text" value="${escapeHtml(n)}"

          slotsHtml += `
            <div class="border border-slate-300 rounded p-1.5 flex flex-col justify-between bg-white">
              <!-- หัวข้อกำกับช่องรูป (ก่อนทำ / หลังทำ / กำหนดเอง) -->
              <div class="flex items-center justify-between gap-1 mb-1">
                <input type="text" value="${escapeHtml(slot.tag)}"

                  <button onclick="clearSlotImage('${page.id}', ${slotIdx})" class="text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded hover:bg-red-200" title="ลบรูป">

              <div onclick="triggerSingleUpload('${page.id}', ${slotIdx})"

                }

              <div class="mt-1">
                ${notesInputsHtml}
                <div class="no-print text-right mt-0.5">
                  <button onclick="addSlotNote('${page.id}', ${slotIdx})" class="text-[9px] text-blue-600 hover:underline font-semibold">
                    + เพิ่มบรรทัดหมายเหตุใต้รูป

                </div>
              </div>
            </div>

        });
        slotsHtml += `</div>`;

        // ส่วนท้ายกระดาษ A4
        const footerHtml = `
          <div class="border-t border-slate-300 pt-1.5 mt-1 flex items-center justify-between text-[10px] text-slate-600">
            <div class="flex-1 mr-4">
              <input type="text" value="${escapeHtml(page.pageFooterNote)}"
                oninput="updatePageFooter('${page.id}', this.value)"
                placeholder="สรุปหมายเหตุท้ายกระดาษ (ถ้ามี)..."
                class="w-full border-b border-dashed border-slate-300 outline-none bg-transparent text-[10px]">
            </div>
            <div class="shrink-0">
              ลงชื่อผู้ตรวจสอบ: ________________________
            </div>
          </div>

        pageEl.innerHTML = headerHtml + slotsHtml + footerHtml;
        container.appendChild(pageEl);
      });
    }

    // แสดงตารางเฉพาะสำหรับหัวข้อที่ 6 (วัดความร้อน 3 ค่า & ความสั่นสะเทือน 3 ค่า) และหัวข้อที่ 7 (Comment / Alarm Code)
    function renderSectionSpecificPanel(page, pageIndex) {
      if (page.sectionNum === 6) {
        const m = page.measurements;
        return `
          <div class="border border-amber-400 bg-amber-50/70 rounded p-2 mb-2 text-[11px]">
            <div class="font-bold text-amber-900 mb-1">ตารางบันทึกค่าตรวจวัด (Temperature °C 3 ค่า และ Vibration mm/s 3 ค่า)</div>
            <div class="grid grid-cols-2 gap-3">
              <div class="bg-white p-1.5 rounded border border-amber-200">

                <div class="grid grid-cols-3 gap-1">
                  <input type="text" placeholder="จุดที่ 1 (°C)" value="${escapeHtml(m.temp1)}" oninput="updateMeasurement('${page.id}','temp1',this.value)" class="border rounded px-1.5 py-0.5 text-[10px]">
                  <input type="text" placeholder="จุดที่ 2 (°C)" value="${escapeHtml(m.temp2)}" oninput="updateMeasurement('${page.id}','temp2',this.value)" class="border rounded px-1.5 py-0.5 text-[10px]">
                  <input type="text" placeholder="จุดที่ 3 (°C)" value="${escapeHtml(m.temp3)}" oninput="updateMeasurement('${page.id}','temp3',this.value)" class="border rounded px-1.5 py-0.5 text-[10px]">
                </div>
              </div>
              <div class="bg-white p-1.5 rounded border border-amber-200">
                <div class="font-bold text-indigo-700 mb-1"><i class="fa-solid fa-wave-square"></i> ความสั่นสะเทือน Vibration (mm/s)</div>
                <div class="grid grid-cols-3 gap-1">
                  <input type="text" placeholder="แกน H/จุด 1 (mm/s)" value="${escapeHtml(m.vib1)}" oninput="updateMeasurement('${page.id}','vib1',this.value)" class="border rounded px-1.5 py-0.5 text-[10px]">
                  <input type="text" placeholder="แกน V/จุด 2 (mm/s)" value="${escapeHtml(m.vib2)}" oninput="updateMeasurement('${page.id}','vib2',this.value)" class="border rounded px-1.5 py-0.5 text-[10px]">
                  <input type="text" placeholder="แกน A/จุด 3 (mm/s)" value="${escapeHtml(m.vib3)}" oninput="updateMeasurement('${page.id}','vib3',this.value)" class="border rounded px-1.5 py-0.5 text-[10px]">
                </div>
              </div>

      }

      if (page.sectionNum === 7) {
        const a = page.alarmData;
        return `
          <div class="border border-purple-300 bg-purple-50/70 rounded p-2 mb-2 text-[11px] space-y-1">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <strong>Alarm Code:</strong>
                <input type="text" placeholder="ระบุรหัสแจ้งเตือน เช่น ALM-402" value="${escapeHtml(a.alarmCode)}" oninput="updateAlarmData('${page.id}','alarmCode',this.value)" class="w-full border rounded px-1.5 py-0.5 bg-white text-[10px]">
              </div>
              <div>
                <strong>หัวข้อเพิ่มเติม:</strong>
                <input type="text" placeholder="ระบุหัวข้อเพิ่มเติม..." value="${escapeHtml(a.extraTopic)}" oninput="updateAlarmData('${page.id}','extraTopic',this.value)" class="w-full border rounded px-1.5 py-0.5 bg-white text-[10px]">
              </div>
            </div>
            <div>
              <strong>ข้อเสนอแนะ (Comment / การแก้ไข):</strong>
              <input type="text" placeholder="ระบุข้อเสนอแนะทางเทคนิค..." value="${escapeHtml(a.comment)}" oninput="updateAlarmData('${page.id}','comment',this.value)" class="w-full border rounded px-1.5 py-0.5 bg-white text-[10px]">
            </div>
          </div>
        `;
      }
      return '';
    }

    // ฟังก์ชันจัดการข้อมูลภายในแต่ละหน้า
    function findPage(pageId) {
      return pagesData.find(p => p.id === pageId);
    }

    function updateSlotTag(pageId, slotIdx, val) {
      const p = findPage(pageId);
      if (p) p.slots[slotIdx].tag = val;
    }

    function updateSlotNote(pageId, slotIdx, noteIdx, val) {
      const p = findPage(pageId);
      if (p) p.slots[slotIdx].notes[noteIdx] = val;
    }

    function addSlotNote(pageId, slotIdx) {
      const p = findPage(pageId);
      if (p) {
        p.slots[slotIdx].notes.push("");
        renderAllPages();
      }
    }

    function removeSlotNote(pageId, slotIdx, noteIdx) {
      const p = findPage(pageId);
      if (p && p.slots[slotIdx].notes.length > 1) {
        p.slots[slotIdx].notes.splice(noteIdx, 1);
        renderAllPages();
      }
    }

    function updateMeasurement(pageId, field, val) {
      const p = findPage(pageId);
      if (p) p.measurements[field] = val;
    }

    function updateAlarmData(pageId, field, val) {
      const p = findPage(pageId);
      if (p) p.alarmData[field] = val;
    }

    function updatePageFooter(pageId, val) {
      const p = findPage(pageId);
      if (p) p.pageFooterNote = val;
    }

    function duplicateSectionPage(pageIndex) {
      const sourcePage = pagesData[pageIndex];
      createSectionPage(sourcePage.sectionNum, true);
    }

    function removePage(pageId) {
      if (pagesData.length <= 1) return;
      pagesData = pagesData.filter(p => p.id !== pageId);
      renderAllPages();
    }

    function clearSlotImage(pageId, slotIdx) {
      const p = findPage(pageId);
      if (p) {
        p.slots[slotIdx].image = null;
        renderAllPages();
      }
    }

    // อัปโหลดหลายรูปพร้อมกัน และจัดเรียงลงช่องว่างในหน้ากระดาษอัตโนมัติ (ถ้าล้นหน้าจะสร้างหน้าใหม่ในหมวดเดิมให้อัตโนมัติ)
    function triggerMultiUpload(pageId) {
      activePageIdForMultiUpload = pageId;
      const input = document.getElementById('multiPhotoInput');
      input.value = '';
      input.click();
    }

    async function handleMultiFilesSelected(event) {
      const files = Array.from(event.target.files);
      if (!files.length || !activePageIdForMultiUpload) return;

      let currentPage = findPage(activePageIdForMultiUpload);
      if (!currentPage) return;

      for (const file of files) {
        const dataUrl = await resizeAndCenterImage(file, 900);
        let emptySlot = currentPage.slots.find(s => !s.image);

        // หากช่องในหน้านี้เต็มแล้ว ให้สร้างหน้ากระดาษใหม่ในหมวดหมู่เดียวกันทันที เพื่อไม่ให้รูปเลยหน้ากระดาษ A4
        if (!emptySlot) {
          createSectionPage(currentPage.sectionNum, false);
          currentPage = pagesData[pagesData.length - 1];
          emptySlot = currentPage.slots[0];
        }
        emptySlot.image = dataUrl;
      }
      renderAllPages();
    }

    // อัปโหลดรูปเดี่ยวลงช่องที่คลิก
    function triggerSingleUpload(pageId, slotIndex) {
      activeSlotForSingleUpload = { pageId, slotIndex };
      const input = document.getElementById('singlePhotoInput');
      input.value = '';
      input.click();
    }

    async function handleSingleFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;
      const dataUrl = await resizeAndCenterImage(file, 900);
      const p = findPage(activeSlotForSingleUpload.pageId);
      if (p && p.slots[activeSlotForSingleUpload.slotIndex]) {
        p.slots[activeSlotForSingleUpload.slotIndex].image = dataUrl;
        renderAllPages();
      }
    }

    // ย่อและจัดรูปให้อยู่ตรงกลางอย่างสวยงามเพื่อความคมชัดและประหยัดพื้นที่
    function resizeAndCenterImage(file, maxSize) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = Math.min(img.width, img.height);
            const targetDim = Math.min(size, maxSize);
            canvas.width = targetDim;
            canvas.height = targetDim;
            const ctx = canvas.getContext('2d');
            const sx = (img.width - size) / 2;
            const sy = (img.height - size) / 2;
            ctx.drawImage(img, sx, sy, size, size, 0, 0, targetDim, targetDim);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ระบบกล้องถ่ายรูปและสลับกล้อง หน้า/หลัง
    async function openCameraModal() {
      const modal = document.getElementById('cameraModal');
      const select = document.getElementById('cameraTargetPage');
      select.innerHTML = pagesData.map((p, idx) => `<option value="${p.id}">หน้าที่ ${idx + 1}: ${p.sectionTitle}</option>`).join('');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      await startCameraStream();
    }

    async function startCameraStream() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode }
        });
        document.getElementById('cameraVideo').srcObject = cameraStream;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึงกล้องบนเบราว์เซอร์");
      }
    }

    async function switchCamera() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      await startCameraStream();
    }

    function capturePhotoFromStream() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.getElementById('cameraCanvas');
      if (!video.videoWidth) return;

      const size = Math.min(video.videoWidth, video.videoHeight);
      canvas.width = 800;
      canvas.height = 800;
      const ctx = canvas.getContext('2d');
      const sx = (video.videoWidth - size) / 2;
      const sy = (video.videoHeight - size) / 2;
      ctx.drawImage(video, sx, sy, size, size, 0, 0, 800, 800);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

      const targetPageId = document.getElementById('cameraTargetPage').value;
      let page = findPage(targetPageId) || pagesData[0];
      let emptySlot = page.slots.find(s => !s.image);
      if (!emptySlot) {
        createSectionPage(page.sectionNum, false);
        page = pagesData[pagesData.length - 1];
        emptySlot = page.slots[0];
      }
      emptySlot.image = dataUrl;
      renderAllPages();
    }

    function closeCameraModal() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      const modal = document.getElementById('cameraModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // ส่งออกไฟล์ .PDF
    function exportToPDF() {
      const machine = document.getElementById('machineCode').value || 'Report';
      const folder = document.getElementById('folderName').value || 'Maintenance';
      const orientation = document.getElementById('pageOrientation').value;
      const element = document.getElementById('documentContainer');

      // ซ่อนปุ่มควบคุมชั่วคราวก่อนสร้าง PDF
      const noPrintEls = element.querySelectorAll('.no-print');
      noPrintEls.forEach(el => el.style.display = 'none');

      const opt = {
        margin: 0,
        filename: `${folder}_${machine}_${document.getElementById('jobDate').value}.pdf`,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: orientation }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        noPrintEls.forEach(el => el.style.display = '');
      });
    }

    // ส่งออกไฟล์ .WORD (.doc ที่เปิดใน Microsoft Word ได้พร้อมรูปภาพและตาราง)
    function exportToWord() {
      const machine = document.getElementById('machineCode').value || 'Report';
      const folder = document.getElementById('folderName').value || 'Maintenance';
      const jobDate = document.getElementById('jobDate').value || '';
      const jobStatus = document.getElementById('jobStatus').value;
      const techName = document.getElementById('techName').value || '-';
      const photoSizeCm = parseInt(document.getElementById('photoSizeCm').value, 10);
      const pxSize = Math.round(photoSizeCm * 37.8);

      let wordHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Maintenance Report</title>
        <style>
          body { font-family: 'Sarabun', 'TH SarabunPSK', sans-serif; font-size: 14pt; }
          table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
          td, th { border: 1px solid #333; padding: 6px; text-align: center; vertical-align: top; }
          .page-break { page-break-after: always; }
        </style>
        </head><body>
      `;

      pagesData.forEach((p, idx) => {
        wordHtml += `
          <h3>${p.sectionTitle}</h3>
          <p><strong>สถานะ:</strong> ${jobStatus} | <strong>รหัสเครื่องจักร:</strong> ${machine} | <strong>วันที่:</strong> ${jobDate} | <strong>ผู้ปฏิบัติงาน:</strong> ${techName}</p>
        `;
        if (p.sectionNum === 6) {
          wordHtml += `<p><strong>Temperature (°C):</strong> ${p.measurements.temp1}, ${p.measurements.temp2}, ${p.measurements.temp3} | <strong>Vibration (mm/s):</strong> ${p.measurements.vib1}, ${p.measurements.vib2}, ${p.measurements.vib3}</p>`;
        }
        if (p.sectionNum === 7) {
          wordHtml += `<p><strong>Alarm Code:</strong> ${p.alarmData.alarmCode} | <strong>หัวข้อเพิ่มเติม:</strong> ${p.alarmData.extraTopic} | <strong>Comment:</strong> ${p.alarmData.comment}</p>`;
        }

        wordHtml += `<table><tr>`;
        p.slots.forEach((s, sIdx) => {
          if (sIdx > 0 && sIdx % 2 === 0) wordHtml += `</tr><tr>`;
          wordHtml += `
            <td>
              <div><strong>${s.tag}</strong></div>
              ${s.image ? `<img src="${s.image}" width="${pxSize}" height="${pxSize}">` : `<p>[ไม่มีรูปภาพ]</p>`}
              <div>${s.notes.filter(Boolean).join('<br>')}</div>
            </td>
          `;
        });
        wordHtml += `</tr></table>`;
        if (idx < pagesData.length - 1) wordHtml += `<br class="page-break">`;
      });

      wordHtml += `</body></html>`;
      const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${folder}_${machine}_${jobDate}.doc`;
      link.click();
    }

    // บันทึกข้อมูลลง Google Sheet และสำรองในเครื่องเพื่อตรวจสอบย้อนหลัง
    async function saveToGoogleSheet() {
      const payload = {
        id: 'JOB-' + Date.now(),
        timestamp: new Date().toLocaleString('th-TH'),
        jobStatus: document.getElementById('jobStatus').value,
        machineCode: document.getElementById('machineCode').value || '-',
        jobDate: document.getElementById('jobDate').value || '-',
        techName: document.getElementById('techName').value || '-',
        folderName: document.getElementById('folderName').value || 'Default_Folder',
        pagesSummary: pagesData.map(p => ({
          sectionTitle: p.sectionTitle,
          measurements: p.measurements,
          alarmData: p.alarmData,
          photoCount: p.slots.filter(s => s.image).length,
          notes: p.slots.map(s => `${s.tag}: ${s.notes.filter(Boolean).join(', ')}`).join(' | ')
        }))
      };

      // บันทึกลงเครื่องทันทีเพื่อให้ตรวจสอบข้อมูลได้ตลอดเวลา
      const localHistory = JSON.parse(localStorage.getItem('MAINT_HISTORY') || '[]');
      localHistory.unshift(payload);
      localStorage.setItem('MAINT_HISTORY', JSON.stringify(localHistory));

      const gasUrl = localStorage.getItem('GAS_WEB_APP_URL');
      if (!gasUrl) {
        alert("บันทึกข้อมูลลงในเครื่องเรียบร้อยแล้ว!\n(หากต้องการส่งเข้า Google Sheet อัตโนมัติ กรุณากดปุ่มรูปฟันเฟืองมุมขวาบนเพื่อใส่ Web App URL)");
        return;
      }

      try {
        await fetch(gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert("✅ บันทึกข้อมูลเข้า Google Sheet และโฟลเดอร์สำเร็จ!");
      } catch (err) {
        alert("บันทึกสำรองในเครื่องสำเร็จ แต่การเชื่อมต่อ Google Sheet ขัดข้อง: " + err.message);
      }
    }

    // เปิดหน้าต่างตรวจสอบข้อมูลที่บันทึกไว้
    function openHistoryModal() {
      const modal = document.getElementById('historyModal');
      const listEl = document.getElementById('historyListContainer');
      const localHistory = JSON.parse(localStorage.getItem('MAINT_HISTORY') || '[]');

      if (localHistory.length === 0) {
        listEl.innerHTML = `<div class="text-center text-slate-400 py-8">ยังไม่มีประวัติการบันทึกข้อมูล</div>`;
      } else {
        listEl.innerHTML = localHistory.map(item => `
          <div class="border border-slate-200 rounded-lg p-3 bg-slate-50 text-xs space-y-1">
            <div class="flex justify-between items-center border-b pb-1">
              <span class="font-bold text-blue-900">รหัสเครื่องจักร: ${escapeHtml(item.machineCode)} (${escapeHtml(item.jobStatus)})</span>
              <span class="text-slate-500">${escapeHtml(item.timestamp)}</span>
            </div>
            <div><strong>วันที่เข้าทำ:</strong> ${escapeHtml(item.jobDate)} | <strong>ผู้ปฏิบัติงาน:</strong> ${escapeHtml(item.techName)} | <strong>โฟลเดอร์:</strong> ${escapeHtml(item.folderName)}</div>
            <div class="text-[11px] text-slate-700 space-y-0.5 pt-1">
              ${item.pagesSummary.map(ps => `
                <div>• <strong>${escapeHtml(ps.sectionTitle)}</strong> (รูปภาพ ${ps.photoCount} รูป) ${ps.notes ? `- ${escapeHtml(ps.notes)}` : ''}</div>
              `).join('')}
            </div>
          </div>
        `).join('');
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeHistoryModal() {
      const modal = document.getElementById('historyModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function openConfigModal() {
      const modal = document.getElementById('configModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeConfigModal() {
      const modal = document.getElementById('configModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveConfigUrl() {
      const url = document.getElementById('gasUrlInput').value.trim();
      localStorage.setItem('GAS_WEB_APP_URL', url);
      closeConfigModal();
      alert("บันทึก URL ของ Google Sheet เรียบร้อยแล้ว");
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
