<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบรายงานซ่อมบำรุงเครื่องจักร A4</title>
  <meta name="theme-color" content="#1e40af">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- ไลบรารีสำหรับสร้าง PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #eff6ff;
      --border: #cbd5e1;
      --text: #1e293b;
      --img-size: 5cm;
      --grid-cols: 2;
    }

    * {
      box-sizing: border-box;
      font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #64748b;
      color: var(--text);
    }

    /* แถบเครื่องมือด้านบน */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0f172a;
      color: white;
      padding: 10px 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .toolbar label {
      font-size: 13px;
      color: #cbd5e1;
      margin-right: 2px;
    }

    .btn, .select-ctrl {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      font-size: 13px;
      cursor: pointer;
      background: #1e293b;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover { background: #334155; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; border-color: #22c55e; }
    .btn-success:hover { background: #15803d; }
    .btn-warning { background: #d97706; border-color: #f59e0b; }
    .btn-danger { background: #dc2626; border-color: #ef4444; }

    /* พื้นที่แสดงกระดาษ A4 */
    .workspace {
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .a4-page {
      background: white;
      width: 210mm;
      min-height: 297mm;
      padding: 12mm;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
    }

    .a4-page.landscape {
      width: 297mm;
      min-height: 210mm;
    }

    /* ส่วนหัวกระดาษ */
    .page-header {
      text-align: center;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 8px;
      margin-bottom: 4px;
    }

    .page-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary);
      margin: 0 0 6px 0;
    }

    .header-meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .header-meta input {
      border: none;
      border-bottom: 1px dashed #64748b;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #0f172a;
      padding: 2px 6px;
      outline: none;
    }

    /* กรอบแต่ละหัวข้อ 1-7 */
    .section-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      background: #fff;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary-light);
      padding: 6px 10px;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .section-title {
      font-weight: bold;
      font-size: 14px;
      color: var(--primary);
    }

    .section-actions {
      display: flex;
      gap: 5px;
    }

    .btn-xs {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      cursor: pointer;
    }
    .btn-xs:hover { background: #f1f5f9; }

    /* ตารางรูปภาพ */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), 1fr);
      gap: 10px;
      justify-items: center;
      align-items: start;
    }

    .photo-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 6px;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      position: relative;
    }

    .slot-badge {
      font-size: 12px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 6px;
      background: #e2e8f0;
      color: #334155;
    }

    .slot-badge.before { background: #fef3c7; color: #b45309; }
    .slot-badge.after { background: #dcfce7; color: #15803d; }

    /* กรอบรูปภาพ จัดกึ่งกลางและปรับขนาดตามตัวแปร */
    .img-frame {
      width: var(--img-size);
      height: var(--img-size);
      max-width: 100%;
      border: 1px solid #94a3b8;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border-radius: 4px;
    }

    .img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .img-placeholder {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      padding: 6px;
      pointer-events: none;
    }

    .slot-controls {
      display: flex;
      gap: 4px;
      margin-top: 5px;
    }

    /* หมายเหตุใต้รูป (เพิ่มได้หลายครั้ง) */
    .notes-list {
      width: 100%;
      margin-top: 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .note-row {
      display: flex;
      align-items: center;
      gap: 3px;
      width: 100%;
    }

    .note-row input {
      flex: 1;
      font-size: 11px;
      padding: 3px 5px;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      text-align: center;
    }

    /* ตารางวัดค่าหัวข้อที่ 6 */
    .measure-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .measure-table th, .measure-table td {
      border: 1px solid #94a3b8;
      padding: 5px;
      text-align: center;
    }

    .measure-table th {
      background: #f1f5f9;
    }

    .measure-table input {
      width: 90%;
      border: none;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      outline: none;
      background: transparent;
    }

    /* กล่องข้อความหัวข้อที่ 7 */
    .comment-area {
      width: 100%;
      min-height: 55px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 6px;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 8px;
    }

    .page-footer-bar {
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
    }

    /* หน้าต่างกล้องถ่ายรูป */
    .camera-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .camera-modal.active { display: flex; }

    #cameraVideo {
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      background: #000;
      border: 2px solid #fff;
    }

    .camera-btns {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ย่อขนาดกระดาษเมื่อเปิดบนจอมือถือ */
    @media screen and (max-width: 820px) {
      .a4-page {
        width: 100%;
        min-height: auto;
        padding: 10px;
      }
      .a4-page.landscape {
        width: 100%;
        min-height: auto;
      }
      .photo-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    /* ตั้งค่าสำหรับการพิมพ์ / Export ไม่ให้ล้นหน้า A4 */
    @media print {
      body { background: white; }
      .no-print { display: none !important; }
      .workspace { padding: 0; gap: 0; }
      .a4-page {
        box-shadow: none;
        margin: 0;
        width: 100%;
        min-height: 100vh;
        page-break-after: always;
      }
      .photo-slot { border: 1px solid #cbd5e1; background: white; }
      .img-placeholder { display: none; }
      .note-row input, .header-meta input, .comment-area {
        border: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- แถบเมนูควบคุม -->
  <div class="toolbar no-print">
    <div class="toolbar-group">
      <button class="btn btn-primary" onclick="addNewA4Page()">+ เพิ่มหน้า A4</button>
      
      <label>แนวกระดาษ:</label>
      <select class="select-ctrl" id="orientationCtrl" onchange="updateOrientation(this.value)">
        <option value="portrait">แนวตั้ง (Portrait)</option>
        <option value="landscape">แนวนอน (Landscape)</option>
      </select>

      <label>ตารางรูป:</label>
      <select class="select-ctrl" id="gridPresetCtrl" onchange="applyGridPreset(this.value)">
        <option value="4" selected>ตาราง 4 รูป</option>
        <option value="6">ตาราง 6 รูป</option>
        <option value="8">ตาราง 8 รูป</option>
        <option value="12">ตาราง 12 รูป</option>
      </select>

      <label>ขนาดกรอบรูป:</label>
      <select class="select-ctrl" id="imgSizeCtrl" onchange="updateImgSize(this.value)">
        <option value="4cm">4 x 4 ซม.</option>
        <option value="5cm" selected>5 x 5 ซม.</option>
        <option value="6cm">6 x 6 ซม.</option>
        <option value="7cm">7 x 7 ซม.</option>
        <option value="8cm">8 x 8 ซม.</option>
        <option value="9cm">9 x 9 ซม.</option>
      </select>
    </div>

    <div class="toolbar-group">
      <button class="btn" onclick="openCameraModal(null)">📷 ถ่ายรูป</button>
      <button class="btn btn-success" onclick="saveProjectFile()">💾 บันทึกงาน (โฟลเดอร์)</button>
      <button class="btn" onclick="document.getElementById('loadJsonInput').click()">📂 เปิดงาน</button>
      <input type="file" id="loadJsonInput" accept=".json" style="display:none" onchange="loadProjectFile(event)">
      
      <button class="btn btn-warning" onclick="exportToPDF()">📄 PDF</button>
      <button class="btn btn-primary" onclick="exportToWord()">📘 WORD</button>
      <button class="btn" onclick="window.print()">🖨️ ปริ้นงาน</button>
      <button class="btn btn-danger" onclick="closeJob()">🔒 ปิดงาน</button>
      <button class="btn" id="installPwaBtn" style="display:none;" onclick="installPWA()">📲 ติดตั้งแอป</button>
    </div>
  </div>

  <!-- พื้นที่วางหน้ากระดาษ A4 -->
  <div class="workspace" id="workspace"></div>

  <!-- โมดอลกล้องถ่ายรูปพร้อมสลับกล้อง -->
  <div class="camera-modal no-print" id="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <div class="camera-btns">
      <button class="btn btn-primary" onclick="switchCamera()">🔄 สลับกล้อง (หน้า/หลัง)</button>
      <button class="btn btn-success" onclick="takeSnapshot()">📸 กดถ่ายรูป</button>
      <button class="btn btn-danger" onclick="closeCameraModal()">✖ ปิดกล้อง</button>
    </div>
  </div>

  <!-- Input ซ่อนสำหรับอัปโหลดรูป -->
  <input type="file" id="singleImageInput" accept="image/*" style="display:none">
  <input type="file" id="multiImageInput" accept="image/*" multiple style="display:none">

  <script>
    // ข้อมูล 7 หัวข้อหลัก แยกเป็นสัดส่วนชัดเจน
    const MAIN_SECTIONS = [
      { id: 1, title: "1. OVERHAUL MOTOR (ก่อนทำ - หลังทำ)", type: "before_after" },
      { id: 2, title: "2. OVERHAUL BLOWER (ก่อนทำ - หลังทำ)", type: "before_after" },
      { id: 3, title: "3. เปลี่ยนสายพาน และ ตั้ง Alignment Laser (ก่อนทำ - หลังทำ)", type: "before_after" },
      { id: 4, title: "4. CLEANING (ก่อนทำ - หลังทำ)", type: "before_after" },
      { id: 5, title: "5. PM (Preventive Maintenance)", type: "general" },
      { id: 6, title: "6. วัดค่าความร้อน Temperature (°C) 3 ค่า / ความสั่นสะเทือน Vibration (mm/s) 3 ค่า", type: "measurement" },
      { id: 7, title: "7. ข้อเสนอแนะ Comment / Alarm Code", type: "comment" }
    ];

    let activeSlotElement = null;
    let activeGridElement = null;
    let cameraStream = null;
    let currentFacingMode = "environment";

    // เริ่มต้นสร้างหน้า A4 หน้าแรก
    window.addEventListener('DOMContentLoaded', () => {
      addNewA4Page();
      initPWA();
    });

    // ฟังก์ชันสร้างช่องใส่รูป 1 ช่อง
    function createPhotoSlot(badgeText = "รูปภาพ", badgeClass = "") {
      const slot = document.createElement('div');
      slot.className = 'photo-slot';
      slot.innerHTML = `
        <span class="slot-badge ${badgeClass}" contenteditable="true">${badgeText}</span>
        <div class="img-frame" onclick="selectSingleImage(this)">
          <div class="img-placeholder">คลิกเพื่มรูป<br>หรือถ่ายรูป</div>
          <img src="" alt="" style="display:none;">
        </div>
        <div class="slot-controls no-print">
          <button class="btn-xs" onclick="selectSingleImage(this.parentElement.previousElementSibling)">📁 เลือกรูป</button>
          <button class="btn-xs" onclick="openCameraModal(this.parentElement.previousElementSibling)">📷 ถ่ายรูป</button>
          <button class="btn-xs" onclick="addNoteRow(this.parentElement.nextElementSibling)">+ หมายเหตุ</button>
          <button class="btn-xs" onclick="this.closest('.photo-slot').remove()">🗑️</button>
        </div>
        <div class="notes-list">
          <div class="note-row">
            <input type="text" placeholder="หมายเหตุใต้รูป...">
            <button class="btn-xs no-print" onclick="this.parentElement.remove()">×</button>
          </div>
        </div>
      `;
      return slot;
    }

    // เพิ่มบรรทัดหมายเหตุใต้รูปได้หลายครั้ง
    function addNoteRow(notesListEl) {
      const row = document.createElement('div');
      row.className = 'note-row';
      row.innerHTML = `
        <input type="text" placeholder="หมายเหตุเพิ่มเติม...">
        <button class="btn-xs no-print" onclick="this.parentElement.remove()">×</button>
      `;
      notesListEl.appendChild(row);
    }

    // สร้างการ์ดหัวข้อ
    function createSectionCard(sec) {
      const card = document.createElement('div');
      card.className = 'section-card';
      card.dataset.sectionId = sec.id;

      let extraContent = '';
      if (sec.type === 'measurement') {
        extraContent = `
          <table class="measure-table">
            <thead>
              <tr>
                <th>รายการวัดค่า</th>
                <th>ค่าที่ 1</th>
                <th>ค่าที่ 2</th>
                <th>ค่าที่ 3</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>ความร้อน Temperature (°C)</strong></td>
                <td><input type="text" placeholder="0.0 °C"></td>
                <td><input type="text" placeholder="0.0 °C"></td>
                <td><input type="text" placeholder="0.0 °C"></td>
              </tr>
              <tr>
                <td><strong>ความสั่นสะเทือน Vibration (mm/s)</strong></td>
                <td><input type="text" placeholder="0.0 mm/s"></td>
                <td><input type="text" placeholder="0.0 mm/s"></td>
                <td><input type="text" placeholder="0.0 mm/s"></td>
              </tr>
            </tbody>
          </table>
        `;
      } else if (sec.type === 'comment') {
        extraContent = `
          <textarea class="comment-area" placeholder="ระบุข้อเสนอแนะ Comment / Alarm Code / รายละเอียดเพิ่มเติม..."></textarea>
        `;
      }

      card.innerHTML = `
        <div class="section-header">
          <div class="section-title" contenteditable="true">${sec.title}</div>
          <div class="section-actions no-print">
            <button class="btn-xs" onclick="triggerMultiUpload(this)">🖼️ เพิ่มหลายรูปพร้อมกัน</button>
            <button class="btn-xs" onclick="addSlotToSection(this, 'ก่อนทำ', 'before')">+ ช่องก่อนทำ</button>
            <button class="btn-xs" onclick="addSlotToSection(this, 'หลังทำ', 'after')">+ ช่องหลังทำ</button>
            <button class="btn-xs" onclick="this.closest('.section-card').remove()">ลบหัวข้อ</button>
          </div>
        </div>
        ${extraContent}
        <div class="photo-grid"></div>
      `;

      const grid = card.querySelector('.photo-grid');
      if (sec.type === 'before_after') {
        grid.appendChild(createPhotoSlot('ก่อนทำ (Before)', 'before'));
        grid.appendChild(createPhotoSlot('หลังทำ (After)', 'after'));
      } else {
        grid.appendChild(createPhotoSlot('รูปประกอบ 1', ''));
        grid.appendChild(createPhotoSlot('รูปประกอบ 2', ''));
      }

      return card;
    }

    // เพิ่มหน้ากระดาษ A4 ใหม่พร้อมหัวข้อ 1-7 แยกสัดส่วน
    function addNewA4Page() {
      const workspace = document.getElementById('workspace');
      const pageNum = workspace.children.length + 1;
      const orientation = document.getElementById('orientationCtrl').value;
      const today = new Date().toISOString().split('T')[0];

      const page = document.createElement('div');
      page.className = `a4-page ${orientation === 'landscape' ? 'landscape' : ''}`;

      page.innerHTML = `
        <div class="page-header">
          <div class="page-title" contenteditable="true">ใบรายงานการซ่อมบำรุงเครื่องจักร (MAINTENANCE REPORT)</div>
          <div class="header-meta">
            <div>รหัสเครื่องจักร (Machine Code): <input type="text" placeholder="ระบุรหัสเครื่องจักร"></div>
            <div>วันที่เข้าทำ (Date): <input type="date" value="${today}"></div>
          </div>
        </div>
        <div class="sections-container" style="display:flex; flex-direction:column; gap:10px;"></div>
        <div class="no-print" style="text-align:center; margin: 6px 0;">
          <button class="btn-xs" onclick="addCustomSection(this)">+ เพิ่มหัวข้อใหม่ในหน้านี้</button>
        </div>
        <div class="page-footer-bar">
          <span>หน้ากระดาษ A4 แยกตามหมวดหมู่ 1 - 7</span>
          <span>หน้าที่ <strong class="page-number">${pageNum}</strong></span>
          <button class="btn-xs no-print" onclick="removeA4Page(this)">ลบหน้านี้</button>
        </div>
      `;

      const container = page.querySelector('.sections-container');
      MAIN_SECTIONS.forEach(sec => {
        container.appendChild(createSectionCard(sec));
      });

      workspace.appendChild(page);
      renumberPages();
    }

    function addCustomSection(btn) {
      const container = btn.parentElement.previousElementSibling;
      const customSec = {
        id: Date.now(),
        title: "หัวข้อเพิ่มเติม (คลิกเพื่อแก้ไขชื่อหัวข้อ)",
        type: "before_after"
      };
      container.appendChild(createSectionCard(customSec));
    }

    function removeA4Page(btn) {
      const workspace = document.getElementById('workspace');
      if (workspace.children.length <= 1) {
        alert("ต้องมีหน้ากระดาษอย่างน้อย 1 หน้าครับ");
        return;
      }
      if (confirm("ต้องการลบหน้ากระดาษนี้ใช่หรือไม่?")) {
        btn.closest('.a4-page').remove();
        renumberPages();
      }
    }

    function renumberPages() {
      document.querySelectorAll('.a4-page .page-number').forEach((el, idx) => {
        el.textContent = idx + 1;
      });
    }

    function addSlotToSection(btn, label, cls) {
      const grid = btn.closest('.section-card').querySelector('.photo-grid');
      grid.appendChild(createPhotoSlot(label, cls));
    }

    // เปลี่ยนแนวตั้ง / แนวนอน
    function updateOrientation(val) {
      document.querySelectorAll('.a4-page').forEach(page => {
        page.classList.toggle('landscape', val === 'landscape');
      });
    }

    // เปลี่ยนขนาดกรอบรูป 4x4 ถึง 9x9 ซม.
    function updateImgSize(size) {
      document.documentElement.style.setProperty('--img-size', size);
    }

    // จัดตาราง 4, 6, 8, 12 รูป และปรับขนาดให้อยู่ในหน้า A4 อย่างเหมาะสม
    function applyGridPreset(count) {
      const num = parseInt(count, 10);
      let cols = 2;
      let suggestedSize = '5cm';

      if (num === 4) { cols = 2; suggestedSize = '6cm'; }
      else if (num === 6) { cols = 3; suggestedSize = '5cm'; }
      else if (num === 8) { cols = 4; suggestedSize = '4cm'; }
      else if (num === 12) { cols = 4; suggestedSize = '4cm'; }

      document.documentElement.style.setProperty('--grid-cols', cols);
      document.documentElement.style.setProperty('--img-size', suggestedSize);
      document.getElementById('imgSizeCtrl').value = suggestedSize;
    }

    // อัปโหลดรูปเดี่ยวลงในช่อง
    const singleInput = document.getElementById('singleImageInput');
    function selectSingleImage(frameEl) {
      activeSlotElement = frameEl;
      singleInput.value = '';
      singleInput.click();
    }

    singleInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !activeSlotElement) return;
      readAndInsertImage(file, activeSlotElement);
    });

    // อัปโหลดหลายรูปพร้อมกันลงในหัวข้อ
    const multiInput = document.getElementById('multiImageInput');
    function triggerMultiUpload(btn) {
      activeGridElement = btn.closest('.section-card').querySelector('.photo-grid');
      multiInput.value = '';
      multiInput.click();
    }

    multiInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length || !activeGridElement) return;

      const emptyFrames = Array.from(activeGridElement.querySelectorAll('.img-frame')).filter(f => {
        const img = f.querySelector('img');
        return !img.getAttribute('src');
      });

      files.forEach((file, index) => {
        if (index < emptyFrames.length) {
          readAndInsertImage(file, emptyFrames[index]);
        } else {
          const newSlot = createPhotoSlot(`รูปที่ ${index + 1}`, '');
          activeGridElement.appendChild(newSlot);
          readAndInsertImage(file, newSlot.querySelector('.img-frame'));
        }
      });
    });

    // ย่อและจัดรูปให้อยู่ตรงกลางอย่างสวยงาม
    function readAndInsertImage(file, frameEl) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const imgObj = new Image();
        imgObj.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 900;
          let w = imgObj.width;
          let h = imgObj.height;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(imgObj, 0, 0, w, h);
          setFrameImage(frameEl, canvas.toDataURL('image/jpeg', 0.85));
        };
        imgObj.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setFrameImage(frameEl, dataUrl) {
      const img = frameEl.querySelector('img');
      const ph = frameEl.querySelector('.img-placeholder');
      img.src = dataUrl;
      img.style.display = 'block';
      if (ph) ph.style.display = 'none';
    }

    // ระบบกล้องถ่ายรูปและสลับกล้อง
    async function openCameraModal(targetFrame) {
      activeSlotElement = targetFrame;
      const modal = document.getElementById('cameraModal');
      modal.classList.add('active');
      await startCameraStream();
    }

    async function startCameraStream() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode },
          audio: false
        });
        document.getElementById('cameraVideo').srcObject = cameraStream;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึงกล้อง หรือใช้งานผ่าน HTTPS / Localhost");
        closeCameraModal();
      }
    }

    function switchCamera() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      startCameraStream();
    }

    function takeSnapshot() {
      const video = document.getElementById('cameraVideo');
      if (!video.videoWidth) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

      if (activeSlotElement) {
        setFrameImage(activeSlotElement, dataUrl);
      } else {
        // หากกดปุ่มถ่ายรูปจากด้านบน ให้ใส่ในช่องว่างช่องแรกของหน้ากระดาษ
        const firstEmpty = Array.from(document.querySelectorAll('.img-frame')).find(f => !f.querySelector('img').getAttribute('src'));
        if (firstEmpty) {
          setFrameImage(firstEmpty, dataUrl);
        } else {
          const firstGrid = document.querySelector('.photo-grid');
          const newSlot = createPhotoSlot('ภาพถ่ายใหม่', '');
          firstGrid.appendChild(newSlot);
          setFrameImage(newSlot.querySelector('.img-frame'), dataUrl);
        }
      }
      closeCameraModal();
    }

    function closeCameraModal() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      document.getElementById('cameraModal').classList.remove('active');
    }

    // ซิงค์ค่าใน Input ลงใน HTML Attribute ก่อนบันทึกหรือส่งออก
    function syncAllInputsToDOM() {
      document.querySelectorAll('input').forEach(inp => {
        inp.setAttribute('value', inp.value);
      });
      document.querySelectorAll('textarea').forEach(ta => {
        ta.innerHTML = ta.value;
      });
    }

    // บันทึกไฟล์งานเก็บเข้าโฟลเดอร์เครื่อง (.json)
    function saveProjectFile() {
      syncAllInputsToDOM();
      const data = {
        orientation: document.getElementById('orientationCtrl').value,
        imgSize: document.getElementById('imgSizeCtrl').value,
        gridPreset: document.getElementById('gridPresetCtrl').value,
        html: document.getElementById('workspace').innerHTML
      };
      const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Maintenance_Report_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // เปิดไฟล์งานที่บันทึกไว้
    function loadProjectFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          document.getElementById('orientationCtrl').value = data.orientation || 'portrait';
          document.getElementById('imgSizeCtrl').value = data.imgSize || '5cm';
          document.getElementById('gridPresetCtrl').value = data.gridPreset || '4';
          updateImgSize(data.imgSize || '5cm');
          document.getElementById('workspace').innerHTML = data.html;
        } catch (err) {
          alert("ไฟล์งานไม่ถูกต้อง");
        }
      };
      reader.readAsText(file);
    }

    // ส่งออกเป็นไฟล์ PDF
    function exportToPDF() {
      syncAllInputsToDOM();
      const isLandscape = document.getElementById('orientationCtrl').value === 'landscape';
      const element = document.getElementById('workspace');
      
      // ซ่อนปุ่มควบคุมชั่วคราวระหว่างสร้าง PDF
      document.querySelectorAll('.no-print').forEach(el => el.style.display = 'none');

      const opt = {
        margin: 0,
        filename: `Maintenance_Report_${new Date().toISOString().slice(0,10)}.pdf`,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: isLandscape ? 'landscape' : 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        document.querySelectorAll('.no-print').forEach(el => el.style.display = '');
      });
    }

    // ส่งออกเป็นไฟล์ WORD (.doc)
    function exportToWord() {
      syncAllInputsToDOM();
      const clone = document.getElementById('workspace').cloneNode(true);
      clone.querySelectorAll('.no-print').forEach(el => el.remove());

      const htmlContent = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Maintenance Report</title>
        <style>
          body { font-family: 'TH SarabunPSK', 'Sarabun', sans-serif; }
          .section-card { border: 1px solid #cbd5e1; margin-bottom: 12px; padding: 8px; }
          .section-title { font-weight: bold; color: #1e40af; background: #eff6ff; padding: 5px; }
          table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
          th, td { border: 1px solid #94a3b8; padding: 5px; text-align: center; }
          img { max-width: 180px; max-height: 180px; }
        </style>
        </head>
        <body>${clone.innerHTML}</body>
        </html>
      `;

      const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Maintenance_Report_${new Date().toISOString().slice(0,10)}.doc`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ปุ่มปิดงาน
    function closeJob() {
      if (confirm("ต้องการปิดงานและล้างหน้ากระดาษเพื่อเริ่มงานใหม่ใช่หรือไม่? (แนะนำให้กดบันทึก PDF/WORD ก่อนปิดงาน)")) {
        document.getElementById('workspace').innerHTML = '';
        addNewA4Page();
      }
    }

    // ระบบติดตั้งเว็บแอปลงในโทรศัพท์ (PWA)
    let deferredPrompt;
    function initPWA() {
      const manifest = {
        name: "ระบบรายงานซ่อมบำรุง A4",
        short_name: "ReportA4",
        start_url: ".",
        display: "standalone",
        background_color: "#ffffff",
        theme_color: "#1e40af"
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(link);

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installPwaBtn').style.display = 'inline-flex';
      });
    }

    async function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installPwaBtn').style.display = 'none';
    }
  </script>
</body>
