<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e3a8a">
  <title>ระบบรายงานซ่อมบำรุง A4 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 0; }

    /* การตั้งค่ากระดาษ A4 มาตรฐาน ไม่ให้ล้นหน้า */
    .a4-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 12px;
    }
    .a4-page {
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .a4-page.portrait {
      width: 210mm;
      height: 297mm;
      padding: 10mm 12mm;
    }
    .a4-page.landscape {
      width: 297mm;
      height: 210mm;
      padding: 10mm 12mm;
    }

    /* ย่อขนาดกระดาษให้พอดีกับหน้าจอมือถืออัตโนมัติ */
    @media screen and (max-width: 820px) {
      .a4-wrapper { padding: 6px; }
      .a4-page.portrait {
        width: 100%;
        height: auto;
        min-height: 135vw;
        padding: 12px;
      }
      .a4-page.landscape {
        width: 100%;
        height: auto;
        min-height: 75vw;
        padding: 12px;
      }
    }

    /* กรอบรูปภาพอยู่ตรงกลางสวยๆ และปรับขนาดตาม ซม. */
    .photo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      background: #f8fafc;
      border: 1.5px dashed #94a3b8;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .photo-box.has-img { border: 1px solid #cbd5e1; background: #fff; }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    /* ขนาดกรอบรูปตามที่กำหนด 4x4 ถึง 9x9 ซม. */
    .size-4 { width: 4cm; height: 4cm; }
    .size-5 { width: 5cm; height: 5cm; }
    .size-6 { width: 6cm; height: 6cm; }
    .size-7 { width: 7cm; height: 7cm; }
    .size-8 { width: 8cm; height: 8cm; }
    .size-9 { width: 9cm; height: 9cm; }

    @media screen and (max-width: 640px) {
      .photo-box { max-width: 100%; }
    }

    /* ตารางจัดหน้า 4, 6, 8, 12 รูป */
    .grid-layout-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .grid-layout-6 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid-layout-8 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .grid-layout-12 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }

    /* สำหรับการสั่งปริ้นท์และบันทึก PDF */
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .a4-wrapper { padding: 0; gap: 0; }
      .a4-page {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        height: 100% !important;
      }
      .photo-box { border: 1px solid #cbd5e1 !important; }
    }
  </style>
</head>
<body>

  <!-- แถบเมนูด้านบนสำหรับมือถือและคอมพิวเตอร์ -->
  <header class="no-print bg-blue-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-3 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="bg-amber-400 text-blue-950 font-bold px-2 py-0.5 rounded text-xs">A4 PRO</span>
        <h1 class="font-bold text-sm sm:text-base">ระบบรายงานซ่อมบำรุงเครื่องจักร</h1>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button onclick="installPWA()" id="pwaBtn" class="bg-teal-500 hover:bg-teal-600 text-white text-xs px-2.5 py-1.5 rounded font-semibold">
          📲 ติดตั้งแอปลงมือถือ
        </button>
        <button onclick="openCameraModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 py-1.5 rounded font-semibold">
          📷 ถ่ายรูป
        </button>
        <button onclick="saveToGoogleSheet()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1.5 rounded font-semibold">
          ☁️ บันทึกลง Sheet
        </button>
        <button onclick="openSearchModal()" class="bg-amber-500 hover:bg-amber-400 text-blue-950 text-xs px-2.5 py-1.5 rounded font-bold">
          🔍 เรียกดูข้อมูล
        </button>
      </div>
    </div>
  </header>

  <!-- แผงควบคุมการตั้งค่ากระดาษ และ สถานะเปิด/ปิดงาน -->
  <section class="no-print max-w-7xl mx-auto p-3">
    <div class="bg-white rounded-xl shadow p-3 border border-slate-200 space-y-3">
      
      <!-- แถวที่ 1: ข้อมูลหลักของเครื่องจักร -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">รหัสเครื่องจักร (Machine ID)</label>
          <input type="text" id="machineId" placeholder="เช่น MTR-001, BLW-02" oninput="syncHeaderInfo()"
            class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm font-semibold focus:outline-blue-600">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">วันที่เข้าทำ (Date)</label>
          <input type="date" id="workDate" onchange="syncHeaderInfo()"
            class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm focus:outline-blue-600">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">สถานะงาน</label>
          <select id="jobStatus" onchange="syncHeaderInfo()" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm font-bold text-emerald-700">
            <option value="เปิดงาน (Open Job)">🟢 เปิดงาน (Open Job)</option>
            <option value="กำลังดำเนินการ (In Progress)">🟡 กำลังดำเนินการ</option>
            <option value="ปิดงาน (Closed Job)">🔴 ปิดงานสมบูรณ์ (Closed)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ลิงก์ Google Sheet</label>
          <a href="https://docs.google.com/spreadsheets/d/1JRG64ajtj9KvbQGfEMOKC5J6dqL2l4g_M_nu5xbMK6k/edit?gid=0#gid=0" target="_blank"
            class="block text-center bg-slate-100 hover:bg-slate-200 text-blue-700 border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold truncate">
            📊 เปิดตาราง Google Sheet
          </a>
        </div>
      </div>

      <!-- แถวที่ 2: ปรับขนาดรูป การวางแนว และจำนวนช่องตาราง -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-2 border-t border-slate-100">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">แนวกระดาษ A4</label>
          <select id="pageOrientation" onchange="applyLayoutSettings()" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold">
            <option value="portrait">📄 แนวตั้ง (Portrait)</option>
            <option value="landscape">🖼️ แนวนอน (Landscape)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">จำนวนรูปต่อหน้ากระดาษ</label>
          <select id="gridCount" onchange="applyLayoutSettings()" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold">
            <option value="4">ตาราง 4 รูป / หน้า</option>
            <option value="6" selected>ตาราง 6 รูป / หน้า</option>
            <option value="8">ตาราง 8 รูป / หน้า</option>
            <option value="12">ตาราง 12 รูป / หน้า</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ขนาดกรอบรูป (ซม.)</label>
          <select id="photoSize" onchange="applyLayoutSettings()" class="w-full border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold">
            <option value="size-4">4 x 4 ซม.</option>
            <option value="size-5" selected>5 x 5 ซม.</option>
            <option value="size-6">6 x 6 ซม.</option>
            <option value="size-7">7 x 7 ซม.</option>
            <option value="size-8">8 x 8 ซม.</option>
            <option value="size-9">9 x 9 ซม.</option>
          </select>
        </div>
        <div class="flex items-end">
          <button onclick="addNewA4Page()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 rounded shadow">
            ➕ เพิ่มหน้ากระดาษ A4 ใหม่
          </button>
        </div>
      </div>

      <!-- แถวที่ 3: ปุ่มส่งออกไฟล์ PDF / WORD / ปริ้นท์งาน -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
        <div class="text-xs text-slate-600 font-semibold">
          📌 แยกสัดส่วนหัวข้อ 1 - 7 ชัดเจน ไม่ปะปนกัน | เพิ่มหลายรูปพร้อมกันได้ในคลิกเดียว
        </div>
        <div class="flex flex-wrap gap-1.5">
          <button onclick="exportToPDF('บันทึกงาน')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs px-3 py-1.5 rounded font-bold">
            📥 บันทึก .PDF
          </button>
          <button onclick="exportToWord('บันทึกงาน')" class="bg-sky-700 hover:bg-sky-800 text-white text-xs px-3 py-1.5 rounded font-bold">
            📘 บันทึก .WORD (.doc)
          </button>
          <button onclick="closeAndPrintJob()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded font-bold">
            🖨️ ปริ้นงาน / ปิดงาน (.PDF/.WORD)
          </button>
        </div>
      </div>

    </div>
  </section>

  <!-- พื้นที่แสดงกระดาษ A4 ทั้งหมด -->
  <main id="a4Container" class="a4-wrapper"></main>

  <!-- Modal กล้องถ่ายรูปพร้อมสลับกล้อง หน้า-หลัง -->
  <div id="cameraModal" class="no-print fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-3">
    <div class="bg-white rounded-xl max-w-md w-full overflow-hidden shadow-2xl">
      <div class="bg-slate-900 text-white px-4 py-2.5 flex justify-between items-center">
        <span class="font-bold text-sm">📷 กล้องถ่ายรูปหน้างาน</span>
        <button onclick="closeCameraModal()" class="text-slate-300 hover:text-white text-lg font-bold">&times;</button>
      </div>
      <div class="p-3 bg-black flex justify-center">
        <video id="cameraVideo" autoplay playsinline class="w-full max-h-80 object-contain rounded"></video>
        <canvas id="cameraCanvas" class="hidden"></canvas>
      </div>
      <div class="p-3 bg-slate-100 flex flex-col gap-2">
        <div class="flex gap-2">
          <select id="cameraTargetSection" class="flex-1 border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold">
            <option value="1">ใส่ในหัวข้อ 1: OVERHAUL MOTOR</option>
            <option value="2">ใส่ในหัวข้อ 2: OVERHAUL BLOWER</option>
            <option value="3">ใส่ในหัวข้อ 3: เปลี่ยนสายพาน / Alignment Laser</option>
            <option value="4">ใส่ในหัวข้อ 4: CLEANING</option>
            <option value="5">ใส่ในหัวข้อ 5: PM</option>
          </select>
          <select id="cameraBeforeAfter" class="border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold">
            <option value="ก่อนทำ">ก่อนทำ</option>
            <option value="หลังทำ">หลังทำ</option>
          </select>
        </div>
        <div class="flex justify-between gap-2">
          <button onclick="switchCamera()" class="flex-1 bg-slate-700 text-white py-2 rounded text-xs font-bold">
            🔄 สลับกล้อง (หน้า/หลัง)
          </button>
          <button onclick="capturePhoto()" class="flex-1 bg-blue-600 text-white py-2 rounded text-xs font-bold">
            📸 กดถ่ายรูปลงตาราง
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal ค้นหาและเรียกดูข้อมูลจาก Google Sheet -->
  <div id="searchModal" class="no-print fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-3">
    <div class="bg-white rounded-xl max-w-lg w-full overflow-hidden shadow-2xl">
      <div class="bg-blue-900 text-white px-4 py-3 flex justify-between items-center">
        <span class="font-bold text-sm">🔍 ตรวจสอบและเรียกข้อมูลตามรหัสเครื่องจักร</span>
        <button onclick="closeSearchModal()" class="text-white text-lg font-bold">&times;</button>
      </div>
      <div class="p-4 space-y-3">
        <div class="flex gap-2">
          <input type="text" id="searchMachineInput" placeholder="พิมพ์รหัสเครื่องจักรที่ต้องการค้นหา..."
            class="flex-1 border border-slate-300 rounded px-3 py-1.5 text-sm">
          <button onclick="searchMachineRecords()" class="bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-bold">
            ค้นหา
          </button>
        </div>
        <div id="searchResultsList" class="max-h-64 overflow-y-auto divide-y divide-slate-200 border rounded p-2 text-xs">
          <p class="text-slate-400 text-center py-4">กดปุ่มค้นหาเพื่อดึงข้อมูลที่บันทึกไว้</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // กำหนดหัวข้อมาตรฐาน 1 - 7 แยกสัดส่วนชัดเจน ไม่ปนกัน
    const SECTIONS_CONFIG = [
      { id: 1, title: '1. OVERHAUL MOTOR (ก่อนทำ - หลังทำ)', type: 'before_after' },
      { id: 2, title: '2. OVERHAUL BLOWER (ก่อนทำ - หลังทำ)', type: 'before_after' },
      { id: 3, title: '3. เปลี่ยนสายพาน และ ตั้ง Alignment Laser (ก่อนทำ - หลังทำ)', type: 'before_after' },
      { id: 4, title: '4. CLEANING (ก่อนทำ - หลังทำ)', type: 'before_after' },
      { id: 5, title: '5. PM (Preventive Maintenance)', type: 'pm_gallery' },
      { id: 6, title: '6. วัดค่าความร้อน Temperature (°C) 3 ค่า และ ความสั่นสะเทือน Vibration (mm/s) 3 ค่า', type: 'measurement' },
      { id: 7, title: '7. ข้อเสนอแนะ Comment / Alarm Code', type: 'comment' }
    ];

    let pagesData = [];
    let currentFacingMode = 'environment';
    let mediaStream = null;
    let deferredPrompt = null;

    // เริ่มต้นระบบเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('workDate').valueAsDate = new Date();
      createInitialReportPages();
      renderAllPages();
    });

    // สร้างหน้าเริ่มต้นโดยแยกสัดส่วนหัวข้อ 1-7 ไม่ให้ล้นหน้ากระดาษ
    function createInitialReportPages() {
      pagesData = [
        {
          pageNumber: 1,
          sectionId: 1,
          customSubHeader: 'หมวดงานซ่อมบำรุงหลัก (ส่วนที่ 1)',
          slots: createEmptySlots(6, true)
        },
        {
          pageNumber: 2,
          sectionId: 6,
          customSubHeader: 'ตารางบันทึกค่าพารามิเตอร์และข้อเสนอแนะ (ส่วนที่ 6 - 7)',
          measurements: { temp1: '', temp2: '', temp3: '', vib1: '', vib2: '', vib3: '' },
          comment: '',
          alarmCode: '',
          extraNotes: ['ตรวจสอบความเรียบร้อยหลังเดินเครื่อง']
        }
      ];
    }

    function createEmptySlots(count, isBeforeAfter) {
      const arr = [];
      for (let i = 0; i < count; i++) {
        arr.push({
          tag: isBeforeAfter ? (i % 2 === 0 ? 'ก่อนทำ' : 'หลังทำ') : `จุดที่ ${i + 1}`,
          imgData: '',
          notes: ['']
        });
      }
      return arr;
    }

    // ฟังก์ชันเรนเดอร์กระดาษ A4 ทุกหน้า
    function renderAllPages() {
      const container = document.getElementById('a4Container');
      const orientation = document.getElementById('pageOrientation').value;
      const gridCount = parseInt(document.getElementById('gridCount').value, 10);
      const photoSize = document.getElementById('photoSize').value;
      const machineId = document.getElementById('machineId').value || '-';
      const workDate = document.getElementById('workDate').value || '-';
      const jobStatus = document.getElementById('jobStatus').value;

      container.innerHTML = '';

      pagesData.forEach((page, pIdx) => {
        const pageEl = document.createElement('div');
        pageEl.className = `a4-page ${orientation}`;

        const secObj = SECTIONS_CONFIG.find(s => s.id === Number(page.sectionId)) || SECTIONS_CONFIG[0];

        // ส่วนหัวกระดาษ A4 (แยกสัดส่วนชัดเจน)
        let headerHTML = `
          <div>
            <div class="border-b-2 border-blue-900 pb-1.5 mb-2 flex justify-between items-start">
              <div>
                <h2 class="text-sm sm:text-base font-bold text-blue-950">ใบรายงานการซ่อมบำรุงเครื่องจักร (MAINTENANCE REPORT)</h2>
                <p class="text-xs text-slate-600 font-semibold">รหัสเครื่องจักร: <span class="text-blue-800 font-bold">${machineId}</span> | วันที่เข้าทำ: <span class="font-bold">${workDate}</span></p>
              </div>
              <div class="text-right">
                <span class="inline-block bg-blue-100 text-blue-900 text-xs font-bold px-2 py-0.5 rounded border border-blue-300">${jobStatus}</span>
                <div class="text-[11px] text-slate-500 mt-0.5">หน้า ${pIdx + 1} / ${pagesData.length}</div>
              </div>
            </div>

            <!-- แถบเลือกหัวข้อ 1-7 ประจำหน้า แยกสัดส่วนไม่ปนกัน -->
            <div class="bg-slate-100 border-l-4 border-blue-800 px-2.5 py-1.5 mb-2 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-1">
                <span class="text-xs font-bold text-blue-950">หัวข้อประจำหน้านี้:</span>
                <select onchange="changePageSection(${pIdx}, this.value)" class="bg-white border border-slate-300 rounded px-2 py-1 text-xs font-bold text-blue-900">
                  ${SECTIONS_CONFIG.map(s => `<option value="${s.id}" ${s.id === Number(page.sectionId) ? 'selected' : ''}>${s.title}</option>`).join('')}
                </select>
              </div>
              <div class="no-print flex items-center gap-1">
                ${secObj.id <= 5 ? `
                  <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold px-2.5 py-1 rounded shadow">
                    🖼️ เพิ่มหลายรูปพร้อมกัน
                    <input type="file" accept="image/*" multiple class="hidden" onchange="uploadMultipleImages(event, ${pIdx})">
                  </label>
                ` : ''}
                ${pagesData.length > 1 ? `
                  <button onclick="removePage(${pIdx})" class="bg-rose-100 hover:bg-rose-200 text-rose-700 text-[11px] font-bold px-2 py-1 rounded">
                    ลบหน้านี้
                  </button>
                ` : ''}
              </div>
            </div>
        `;

        // เนื้อหาตามประเภทหัวข้อ (1-5 เป็นตารางรูปภาพ, 6-7 เป็นตารางวัดค่าความร้อน/ความสั่นสะเทือน และข้อเสนอแนะ)
        let bodyHTML = '';

        if (secObj.id <= 5) {

    // อัปเดตข้อมูลหัวกระดาษทันทีเมื่อพิมพ์
    function syncHeaderInfo() {

    }

    function changePageSection(pageIdx, newSecId) {
      pagesData[pageIdx].sectionId = Number(newSecId);
      if (Number(newSecId) >= 6 && !pagesData[pageIdx].measurements) {
        pagesData[pageIdx].measurements = { temp1: '', temp2: '', temp3: '', vib1: '', vib2: '', vib3: '' };
        pagesData[pageIdx].extraNotes = [''];
      }
      if (Number(newSecId) <= 5 && !pagesData[pageIdx].slots) {
        pagesData[pageIdx].slots = createEmptySlots(12, true);
      }
      renderAllPages();
    }

    function addNewA4Page() {
      const gridCount = parseInt(document.getElementById('gridCount').value, 10);
      pagesData.push({
        pageNumber: pagesData.length + 1,
        sectionId: 1,
        slots: createEmptySlots(gridCount, true)
      });
      renderAllPages();
    }

    function removePage(pageIdx) {
      pagesData.splice(pageIdx, 1);
      renderAllPages();
    }

    // อัปโหลดรูปเดี่ยวและย่อขนาดภาพอัตโนมัติให้คมชัดและไม่หนักเครื่อง
    function uploadSingleImage(event, pIdx, sIdx) {
      const file = event.target.files[0];
      if (!file) return;
      resizeAndReadImage(file, (dataUrl) => {
        pagesData[pIdx].slots[sIdx].imgData = dataUrl;
        renderAllPages();
      });
    }

    // อัปโหลดหลายรูปพร้อมกัน จัดเรียงลงช่องว่างและสร้างหน้าใหม่อัตโนมัติหากเกินจำนวนช่อง
    function uploadMultipleImages(event, startPageIdx) {
      const files = Array.from(event.target.files);
      if (!files.length) return;
      const gridCount = parseInt(document.getElementById('gridCount').value, 10);

      let currentP = startPageIdx;
      let currentS = 0;

      // หาช่องว่างแรกในหน้าปัจจุบัน
      while (currentS < gridCount && pagesData[currentP].slots[currentS]?.imgData) {
        currentS++;
      }

      let processed = 0;
      files.forEach((file) => {
        resizeAndReadImage(file, (dataUrl) => {
          if (currentS >= gridCount) {
            // สร้างหน้ากระดาษ A4 ใหม่ในหัวข้อเดียวกันอัตโนมัติเพื่อไม่ให้ล้นหน้ากระดาษ
            pagesData.push({
              pageNumber: pagesData.length + 1,
              sectionId: pagesData[currentP].sectionId,
              slots: createEmptySlots(gridCount, true)
            });
            currentP = pagesData.length - 1;
            currentS = 0;
          }
          pagesData[currentP].slots[currentS].imgData = dataUrl;
          currentS++;
          processed++;
          if (processed === files.length) {
            renderAllPages();
          }
        });
      });
    }

    function resizeAndReadImage(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 900;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearSlotImage(pIdx, sIdx) {
      pagesData[pIdx].slots[sIdx].imgData = '';
      renderAllPages();
    }

    function updateSlotTag(pIdx, sIdx, val) {
      pagesData[pIdx].slots[sIdx].tag = val;
    }

    function updateSlotNote(pIdx, sIdx, nIdx, val) {
      pagesData[pIdx].slots[sIdx].notes[nIdx] = val;
    }

    function addSlotNote(pIdx, sIdx) {
      pagesData[pIdx].slots[sIdx].notes.push('');
      renderAllPages();
    }

    function removeSlotNote(pIdx, sIdx, nIdx) {
      pagesData[pIdx].slots[sIdx].notes.splice(nIdx, 1);
      renderAllPages();
    }

    function updateMeasurement(pIdx, key, val) {
      if (!pagesData[pIdx].measurements) {
        pagesData[pIdx].measurements = { temp1: '', temp2: '', temp3: '', vib1: '', vib2: '', vib3: '' };
      }
      pagesData[pIdx].measurements[key] = val;
    }

    function addExtraTopic(pIdx) {
      if (!pagesData[pIdx].extraNotes) pagesData[pIdx].extraNotes = [];
      pagesData[pIdx].extraNotes.push('');
      renderAllPages();
    }

    // ระบบกล้องถ่ายรูปและสลับกล้อง หน้า-หลัง
    async function openCameraModal() {
      document.getElementById('cameraModal').classList.remove('hidden');
      await startCameraStream();
    }

    async function startCameraStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
      }
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode }
        });
        document.getElementById('cameraVideo').srcObject = mediaStream;
      } catch (err) {
        alert('ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการเข้าถึงกล้องในเบราว์เซอร์');
      }
    }

    function switchCamera() {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCameraStream();
    }

    function capturePhoto() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.getElementById('cameraCanvas');
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

      const targetSec = Number(document.getElementById('cameraTargetSection').value);
      const tagType = document.getElementById('cameraBeforeAfter').value;
      const gridCount = parseInt(document.getElementById('gridCount').value, 10);

      // ค้นหาหน้าที่มีหัวข้อตรงกันและยังมีช่องว่าง
      let targetPage = pagesData.find(p => Number(p.sectionId) === targetSec && p.slots && p.slots.slice(0, gridCount).some(s => !s.imgData));

      if (!targetPage) {
        targetPage = {
          pageNumber: pagesData.length + 1,
          sectionId: targetSec,
          slots: createEmptySlots(gridCount, true)
        };
        pagesData.push(targetPage);
      }

      const emptySlot = targetPage.slots.slice(0, gridCount).find(s => !s.imgData);
      if (emptySlot) {
        emptySlot.imgData = dataUrl;
        emptySlot.tag = tagType;
      }

      renderAllPages();
      closeCameraModal();
    }

    function closeCameraModal() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
      }
      document.getElementById('cameraModal').classList.add('hidden');
    }

    // บันทึกเป็นไฟล์ PDF ลงโฟลเดอร์เครื่อง
    function exportToPDF(prefix) {
      const machineId = document.getElementById('machineId').value || 'Machine';
      const workDate = document.getElementById('workDate').value || 'Date';
      const orientation = document.getElementById('pageOrientation').value;
      const element = document.getElementById('a4Container');

      const opt = {
        margin: 0,
        filename: `${prefix}_${machineId}_${workDate}.pdf`,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: orientation }
      };
      html2pdf().set(opt).from(element).save();
    }

    // บันทึกเป็นไฟล์ Word (.doc) พร้อมรูปภาพและตารางครบถ้วน
    function exportToWord(prefix) {
      const machineId = document.getElementById('machineId').value || 'Machine';
      const workDate = document.getElementById('workDate').value || 'Date';
      const content = document.getElementById('a4Container').innerHTML;

      const htmlDoc = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Maintenance Report</title>
        <style>
          body { font-family: 'Sarabun', sans-serif; }
          img { max-width: 180px; height: auto; display: block; margin: 0 auto; }
          table, div { border-collapse: collapse; }
        </style>
        </head><body>${content}</body></html>
      `;

      const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${prefix}_${machineId}_${workDate}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // บันทึกข้อมูลเข้า Google Sheet (และสำรองในเครื่องอัตโนมัติ)
    function saveToGoogleSheet() {
      const machineId = document.getElementById('machineId').value.trim();
      if (!machineId) {
        alert('กรุณากรอก "รหัสเครื่องจักร" ก่อนบันทึกข้อมูล');
        return;
      }

      const mPage = pagesData.find(p => Number(p.sectionId) >= 6) || {};
      const m = mPage.measurements || {};

      const payload = {
        machineId: machineId,
        workDate: document.getElementById('workDate').value,
        jobStatus: document.getElementById('jobStatus').value,
        temp1: m.temp1 || '',
        temp2: m.temp2 || '',
        temp3: m.temp3 || '',
        vib1: m.vib1 || '',
        vib2: m.vib2 || '',
        vib3: m.vib3 || '',
        comment: (mPage.alarmCode ? `[Alarm: ${mPage.alarmCode}] ` : '') + (mPage.comment || ''),
        pagesData: pagesData
      };

      // บันทึกสำรองลง LocalStorage ทันที
      const localRecords = JSON.parse(localStorage.getItem('MAINT_RECORDS') || '[]');
      localRecords.unshift(payload);
      localStorage.setItem('MAINT_RECORDS', JSON.stringify(localRecords.slice(0, 30)));

      // หากเปิดผ่าน Google Apps Script ให้ส่งเข้า Google Sheet โดยตรง
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => alert(res.message))
          .withFailureHandler((err) => alert('เกิดข้อผิดพลาดในการบันทึก: ' + err))
          .saveJobToSheet(payload);
      } else {
        alert('บันทึกข้อมูลรหัสเครื่องจักร ' + machineId + ' สำเร็จ! (เมื่อติดตั้งใน Google Apps Script ข้อมูลจะซิงค์เข้า Google Sheet อัตโนมัติ)');
      }
    }

    // ค้นหาและเรียกดูข้อมูลตามรหัสเครื่องจักร
    function openSearchModal() {
      document.getElementById('searchModal').classList.remove('hidden');
      searchMachineRecords();
    }

      document.getElementById('searchModal').classList.add('hidden');

    function searchMachineRecords() {
      const query = document.getElementById('searchMachineInput').value.trim();
      const listEl = document.getElementById('searchResultsList');
      listEl.innerHTML = '<p class="text-center py-3 text-slate-500">กำลังค้นหาข้อมูล...</p>';

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((records) => renderSearchResults(records))
          .loadJobByMachine(query);
      } else {
        const localRecords = JSON.parse(localStorage.getItem('MAINT_RECORDS') || '[]');
        const filtered = localRecords.filter(r => !query || r.machineId.toLowerCase().includes(query.toLowerCase()));
        renderSearchResults(filtered);
      }
    }

    function renderSearchResults(records) {
      const listEl = document.getElementById('searchResultsList');
      if (!records || !records.length) {
        listEl.innerHTML = '<p class="text-center py-4 text-slate-400">ไม่พบประวัติของรหัสเครื่องจักรนี้</p>';
        return;
      }
      listEl.innerHTML = records.map((rec, idx) => `
        <div class="py-2 px-2 flex justify-between items-center hover:bg-slate-50">
          <div>
            <div class="font-bold text-blue-900">${rec.machineId} <span class="text-xs font-normal text-slate-500">(${rec.workDate})</span></div>
            <div class="text-[11px] text-emerald-700 font-semibold">${rec.jobStatus} | Temp: ${rec.temp1 || '-'}/${rec.temp2 || '-'}/${rec.temp3 || '-'} °C</div>
          </div>
          <button onclick='loadRecordIntoApp(${JSON.stringify(rec).replace(/'/g, "&#39;")})'
            class="bg-blue-600 text-white px-2.5 py-1 rounded text-xs font-bold">
            เรียกดูข้อมูล
          </button>
        </div>
      `).join('');
    }

    function loadRecordIntoApp(rec) {
      document.getElementById('machineId').value = rec.machineId || '';
      document.getElementById('workDate').value = rec.workDate || '';
      document.getElementById('jobStatus').value = rec.jobStatus || 'เปิดงาน (Open Job)';
      if (rec.pagesData && rec.pagesData.length) {
        pagesData = rec.pagesData;
      }
      renderAllPages();
      closeSearchModal();
    }

    // ฟังก์ชันติดตั้งแอปลงหน้าจอมือถือ (PWA)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
      } else {
        alert('วิธีติดตั้งแอปลงโทรศัพท์:\n1. สำหรับ iPhone (Safari): กดปุ่ม "แชร์" ด้านล่าง แล้วเลือก "เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)"\n2. สำหรับ Android (Chrome): กดปุ่มจุด 3 จุด มุมขวาบน แล้วเลือก "ติดตั้งแอป" หรือ "เพิ่มลงในหน้าจอหลัก"');
      }
    }
  </script>
</body>
</html>
