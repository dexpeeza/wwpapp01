<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรายงานซ่อมบำรุง A4 (Maintenance Report Builder)</title>
  <!-- Libraries สำหรับแปลงเป็น PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      font-family: 'Sarabun', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: #1e293b;
    }

    /* แถบเครื่องมือด้านบน (ซ่อนเวลาพิมพ์/Export) */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--card);
      border-bottom: 2px solid var(--border);
      padding: 12px 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .toolbar-row:last-child {
      margin-bottom: 0;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .toolbar-group label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }

    input[type="text"], input[type="date"], input[type="number"], select {
      padding: 5px 8px;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 13px;
      background: #fff;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: 0.15s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary-light); color: white; }
    .btn-dark { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: white; color: #334155; border: 1px solid #94a3b8; }

    /* พื้นที่แสดงกระดาษ A4 */
    .workspace {
      padding: 25px 15px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* ขนาดกระดาษ A4 มาตรฐาน */
    .a4-page {
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 12mm 14mm;
      page-break-after: always;
      break-after: page;
      overflow: hidden;
    }

    .a4-page.portrait {
      width: 210mm;
      min-height: 297mm;
    }

    .a4-page.landscape {
      width: 297mm;
      min-height: 210mm;
    }

    /* แถบควบคุมแต่ละหน้า */
    .page-controls {
      background: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #cbd5e1;
    }

    /* ส่วนหัวกระดาษ A4 (จัดกึ่งกลาง) */
    .page-header {
      text-align: center;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 18pt;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 4px 0;
      outline: none;
    }

    .page-meta {
      display: flex;
      justify-content: center;
      gap: 25px;
      font-size: 11pt;
      font-weight: 600;
      color: #334155;
    }

    /* กล่องข้อความแทรกกลางหน้ากระดาษ */
    .center-notes-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      width: 100%;
    }

    .center-note-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .center-note-text {
      text-align: center;
      font-size: 12pt;
      font-weight: 600;
      padding: 4px 12px;
      border: 1px dashed transparent;
      border-radius: 4px;
      min-width: 60%;
      outline: none;
    }
    .center-note-text:hover, .center-note-text:focus {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    /* แถบป้าย ก่อนทำ / หลังทำ */
    .before-after-banner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      text-align: center;
      font-weight: 700;
      font-size: 12pt;
      margin-bottom: 8px;
      gap: 12px;
    }
    .before-after-banner div {
      background: #f1f5f9;
      border: 1px solid #64748b;
      padding: 4px;
      border-radius: 4px;
    }

    /* ตารางรูปภาพ A4 */
    .photo-grid {
      display: grid;
      gap: 10px;
      width: 100%;
      justify-items: center;
      align-items: start;
      margin: 0 auto;
    }

    /* กำหนดคอลัมน์ตามจำนวนรูปและแนวกระดาษ */
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-6 { grid-template-columns: repeat(2, 1fr); }
    .a4-page.landscape .grid-6 { grid-template-columns: repeat(3, 1fr); }
    .grid-8 { grid-template-columns: repeat(2, 1fr); }
    .a4-page.landscape .grid-8 { grid-template-columns: repeat(4, 1fr); }
    .grid-12 { grid-template-columns: repeat(3, 1fr); }
    .a4-page.landscape .grid-12 { grid-template-columns: repeat(4, 1fr); }

    .photo-cell {
      width: 100%;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
    }

    /* กรอบรูปภาพ จัดกึ่งกลางและปรับขนาดซม. */
    .photo-frame {
      border: 1px dashed #cbd5e1;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      margin: 0 auto 6px auto;
      cursor: pointer;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-placeholder {
      text-align: center;
      color: #64748b;
      font-size: 11px;
      padding: 8px;
      line-height: 1.4;
    }

    /* ขนาดกรอบรูปตามที่กำหนด (ซม.) */
    .size-auto { width: 100%; height: 48mm; }
    .size-4x4 { width: 4cm; height: 4cm; }
    .size-5x5 { width: 5cm; height: 5cm; }
    .size-6x6 { width: 6cm; height: 6cm; }
    .size-7x7 { width: 7cm; height: 7cm; }
    .size-8x8 { width: 8cm; height: 8cm; }
    .size-9x9 { width: 9cm; height: 9cm; }

    .cell-actions {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .cell-actions button {
      padding: 3px 7px;
      font-size: 11px;
    }

    /* หมายเหตุใต้รูปภาพ (เพิ่มได้หลายครั้ง) */
    .captions-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .caption-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .caption-input {
      flex: 1;
      text-align: center;
      font-size: 10.5pt;
      border: none;
      border-bottom: 1px dotted #94a3b8;
      padding: 2px 4px;
      outline: none;
      width: 100%;
    }
    .caption-input:focus {
      border-bottom-color: var(--primary-light);
      background: #f8fafc;
    }

    .btn-del-mini {
      background: transparent;
      color: #ef4444;
      padding: 0 4px;
      font-size: 12px;
      border: none;
    }

    /* ตารางวัดค่าหน้า 6 และ Comment หน้า 7 */
    .special-section {
      width: 100%;
      margin-bottom: 12px;
      border: 1px solid #64748b;
      border-radius: 6px;
      padding: 10px;
      background: #f8fafc;
    }

    .measure-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      background: white;
    }
    .measure-table th, .measure-table td {
      border: 1px solid #64748b;
      padding: 6px 8px;
      text-align: center;
      font-size: 11pt;
    }
    .measure-table th {
      background: #e2e8f0;
    }
    .measure-table input {
      width: 90%;
      text-align: center;
      border: 1px solid #cbd5e1;
      padding: 4px;
      font-size: 11pt;
    }

    .comment-box {
      width: 100%;
      min-height: 90px;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      padding: 8px;
      font-size: 11pt;
      resize: vertical;
    }

    .page-footer {
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #cbd5e1;
      display: flex;
      justify-content: space-between;
      font-size: 9.5pt;
      color: #475569;
    }

    /* Modal กล้องถ่ายรูป */
    .camera-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .camera-modal.active { display: flex; }

    .camera-box {
      background: white;
      padding: 16px;
      border-radius: 10px;
      max-width: 550px;
      width: 100%;
      text-align: center;
    }

    video#cameraStream {
      width: 100%;
      max-height: 60vh;
      background: #000;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    /* โหมดพิมพ์และ Export PDF/Word ซ่อนปุ่มควบคุมทั้งหมด */
    @media print {
      body { background: white; }
      .no-print { display: none !important; }
      .workspace { padding: 0; gap: 0; }
      .a4-page {
        box-shadow: none;
        margin: 0;
      }
      .photo-frame { border: 1px solid #cbd5e1; }
      .caption-input { border-bottom: none; }
    }

    .exporting .no-print {
      display: none !important;
    }
    .exporting .a4-page {
      box-shadow: none !important;
      margin: 0 auto !important;
    }
  </style>
</head>
<body>

  <!-- แถบเครื่องมือหลัก -->
  <div class="toolbar no-print">
    <!-- แถวที่ 1: ข้อมูลหลักของงาน & การเปิด-ปิดงาน -->
    <div class="toolbar-row">
      <div class="toolbar-group">
        <label>รหัสเครื่องจักร:</label>
        <input type="text" id="globalMachineCode" value="MC-001" placeholder="ระบุรหัสเครื่องจักร..." oninput="syncGlobalMeta()">
      </div>

      <div class="toolbar-group">
        <label>วันที่เข้าทำ:</label>
        <input type="date" id="globalJobDate" onchange="syncGlobalMeta()">
      </div>

      <div class="toolbar-group">
        <label>สถานะงาน:</label>
        <span id="jobStatusBadge" style="font-size:13px; font-weight:700; color:#16a34a;">กำลังเปิดงาน</span>
      </div>

      <div class="toolbar-group">
        <button class="btn-outline" onclick="openJobFile()">📂 เปิดงาน (.json)</button>
        <input type="file" id="openJobInput" accept=".json" style="display:none" onchange="handleOpenJobFile(event)">
        <button class="btn-primary" onclick="saveJobToFolder()">💾 บันทึกเข้าโฟลเดอร์</button>
        <button class="btn-danger" onclick="closeJobFlow()">🔒 บันทึก / ปิดงาน</button>
      </div>

      <div class="toolbar-group">
        <button class="btn-success" onclick="exportToPDF()">📄 ส่งออก PDF</button>
        <button class="btn-dark" onclick="exportToWord()">📝 ส่งออก WORD (.doc)</button>
        <button class="btn-outline" onclick="window.print()">🖨️ พิมพ์ A4</button>
      </div>
    </div>

    <!-- แถวที่ 2: ตั้งค่าหน้ากระดาษ ตาราง ขนาดรูป และกล้อง -->
    <div class="toolbar-row">
      <div class="toolbar-group">
        <label>ตั้งค่าทุกหน้า:</label>
        <select id="globalOrientation" onchange="applyGlobalOrientation(this.value)">
          <option value="portrait">แนวตั้ง (Portrait)</option>
          <option value="landscape">แนวนอน (Landscape)</option>
        </select>

        <select id="globalGridCount" onchange="applyGlobalGridCount(this.value)">
          <option value="4" selected>ตาราง 4 รูป / หน้า</option>
          <option value="6">ตาราง 6 รูป / หน้า</option>
          <option value="8">ตาราง 8 รูป / หน้า</option>
          <option value="12">ตาราง 12 รูป / หน้า</option>
        </select>

        <select id="globalFrameSize" onchange="applyGlobalFrameSize(this.value)">
          <option value="size-auto">ขนาดกรอบ: อัตโนมัติ</option>
          <option value="size-4x4">ขนาดกรอบ: 4x4 ซม.</option>
          <option value="size-5x5">ขนาดกรอบ: 5x5 ซม.</option>
          <option value="size-6x6" selected>ขนาดกรอบ: 6x6 ซม.</option>
          <option value="size-7x7">ขนาดกรอบ: 7x7 ซม.</option>
          <option value="size-8x8">ขนาดกรอบ: 8x8 ซม.</option>
          <option value="size-9x9">ขนาดกรอบ: 9x9 ซม.</option>
        </select>
      </div>

      <div class="toolbar-group">
        <button class="btn-warning" onclick="openCameraModal(null, null)">📷 กดถ่ายรูป (ใส่ช่องว่างถัดไป)</button>
      </div>

      <div class="toolbar-group">
        <button class="btn-primary" onclick="addNewPage()">➕ เพิ่มหน้ากระดาษใหม่</button>
        <button class="btn-outline" onclick="resetToDefault7Pages()">🔄 โหลดหัวข้อมาตรฐาน 7 หน้าใหม่</button>
      </div>
    </div>
  </div>

  <!-- พื้นที่แสดงหน้ากระดาษ A4 ทั้งหมด -->
  <div id="workspace" class="workspace"></div>

  <!-- Modal กล้องถ่ายรูปพร้อมสลับกล้อง -->
  <div id="cameraModal" class="camera-modal no-print">
    <div class="camera-box">
      <h3 style="margin:0 0 10px 0;">📷 กล้องถ่ายรูปงานซ่อมบำรุง</h3>
      <video id="cameraStream" autoplay playsinline></video>
      <canvas id="cameraCanvas" style="display:none;"></canvas>
      <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
        <button class="btn-primary" onclick="capturePhotoFromCamera()">📸 กดถ่ายรูป</button>
        <button class="btn-warning" onclick="switchCameraFacing()">🔄 สลับกล้อง (หน้า/หลัง)</button>
        <button class="btn-danger" onclick="closeCameraModal()">✖ ปิดกล้อง</button>
      </div>
      <p id="cameraTargetInfo" style="font-size:12px; color:#64748b; margin-top:8px;"></p>
    </div>
  </div>

  <script>
    // ตั้งค่าวันที่ปัจจุบันเป็นค่าเริ่มต้น
    document.getElementById('globalJobDate').valueAsDate = new Date();

    // โครงสร้างข้อมูลของแต่ละหน้า
    let pagesData = [];
    let currentCameraStream = null;
    let currentFacingMode = 'environment'; // เริ่มที่กล้องหลังสำหรับมือถือ
    let cameraTarget = { pageIndex: null, cellIndex: null };

    // หัวข้อมาตรฐาน 7 หน้าตามความต้องการของผู้ใช้
    const DEFAULT_7_PAGES = [
      {
        title: "หน้า 1. OVERHAUL MOTOR ก่อนทำ - หลังทำ",
        beforeAfter: true,
        type: "normal",
        centerNotes: ["รายการตรวจเช็คและถอดประกอบ OVERHAUL MOTOR"]
      },
      {
        title: "หน้า 2. OVERHAUL BLOWER ก่อนทำ - หลังทำ",
        beforeAfter: true,
        type: "normal",
        centerNotes: ["รายการตรวจเช็คและถอดประกอบ OVERHAUL BLOWER"]
      },
      {
        title: "หน้า 3. เปลี่ยนสายพาน และ ตั้ง Alignment Laser ก่อนทำ - หลังทำ",
        beforeAfter: true,
        type: "normal",
        centerNotes: ["ตรวจสอบความตึงสายพานและตั้งศูนย์ด้วย Alignment Laser"]
      },
      {
        title: "หน้า 4. CLEANING ก่อนทำ - หลังทำ",
        beforeAfter: true,
        type: "normal",
        centerNotes: ["ทำความสะอาดชิ้นส่วนและพื้นที่เครื่องจักร"]
      },
      {
        title: "หน้า 5. PM (Preventive Maintenance)",
        beforeAfter: false,
        type: "normal",
        centerNotes: ["การบำรุงรักษาเชิงป้องกันตามแผนงาน (PM)"]
      },
      {
        title: "หน้า 6. วัดค่าความร้อน Temperature (°C) และความสั่นสะเทือน Vibration (mm/s)",
        beforeAfter: false,
        type: "measurement",
        centerNotes: ["บันทึกผลการวัดค่าพารามิเตอร์หลังการซ่อมบำรุง"],
        measurements: {
          temp: ["", "", ""],
          vib: ["", "", ""]
        }
      },
      {
        title: "หน้า 7. ข้อเสนอแนะ Comment / Alarm Code",
        beforeAfter: false,
        type: "comment",
        centerNotes: ["สรุปผลการดำเนินงาน ข้อเสนอแนะ และรหัสแจ้งเตือน (Alarm Code)"],
        alarmCode: "",
        commentText: ""
      }
    ];

    // สร้างข้อมูลเซลล์รูปภาพเริ่มต้น
    function createEmptyCells(count) {
      const cells = [];
      for (let i = 0; i < count; i++) {
        cells.push({
          image: null,
          captions: ["หมายเหตุ: "]
        });
      }
      return cells;
    }

    // โหลดหน้าเริ่มต้น 7 หน้า
    function initDefaultPages() {
      const orientation = document.getElementById('globalOrientation').value;
      const gridCount = parseInt(document.getElementById('globalGridCount').value, 10);
      const frameSize = document.getElementById('globalFrameSize').value;

      pagesData = DEFAULT_7_PAGES.map(tpl => ({
        title: tpl.title,
        orientation: orientation,
        gridCount: gridCount,
        frameSize: frameSize,
        beforeAfter: tpl.beforeAfter,
        type: tpl.type,
        centerNotes: [...tpl.centerNotes],
        measurements: tpl.measurements ? JSON.parse(JSON.stringify(tpl.measurements)) : { temp: ["", "", ""], vib: ["", "", ""] },
        alarmCode: tpl.alarmCode || "",
        commentText: tpl.commentText || "",
        cells: createEmptyCells(gridCount)
      }));

      renderAllPages();
    }

    function resetToDefault7Pages() {
      if (confirm("ต้องการรีเซ็ตและโหลดหัวข้อมาตรฐาน 7 หน้าใหม่ทั้งหมดหรือไม่? (ข้อมูลที่ใส่ไว้จะถูกล้าง)")) {
        initDefaultPages();
      }
    }

    // วาดหน้ากระดาษ A4 ทั้งหมด
    function renderAllPages() {
      const workspace = document.getElementById('workspace');
      workspace.innerHTML = '';

      const machineCode = document.getElementById('globalMachineCode').value || '-';
      const jobDate = document.getElementById('globalJobDate').value || '-';

      pagesData.forEach((page, pIdx) => {
        // ปรับจำนวนช่องรูปให้ตรงกับ gridCount
        while (page.cells.length < page.gridCount) {
          page.cells.push({ image: null, captions: ["หมายเหตุ: "] });
        }

        const pageEl = document.createElement('div');
        pageEl.className = `a4-page ${page.orientation}`;

        // 1. แถบเครื่องมือประจำหน้า (ซ่อนตอนพิมพ์)
        const controlsEl = document.createElement('div');

    // อัปเดตข้อมูลรหัสเครื่องจักรและวันที่แบบ Real-time

    // เปลี่ยนการตั้งค่าทุกหน้าพร้อมกัน

    }

    // เพิ่มและลบหน้ากระดาษ A4
    function addNewPage() {
      const orientation = document.getElementById('globalOrientation').value;
      const gridCount = parseInt(document.getElementById('globalGridCount').value, 10);
      const frameSize = document.getElementById('globalFrameSize').value;
      const newPageNum = pagesData.length + 1;

      pagesData.push({
        title: `หน้า ${newPageNum}. รายละเอียดการดำเนินงานเพิ่มเติม`,
        orientation: orientation,
        gridCount: gridCount,
        frameSize: frameSize,
        beforeAfter: true,
        type: "normal",
        centerNotes: ["หัวข้อรายละเอียดงาน (คลิกเพื่อแก้ไข)"],
        measurements: { temp: ["", "", ""], vib: ["", "", ""] },
        alarmCode: "",

      });

    function removePage(pIdx) {
      if (pagesData.length <= 1) {
        alert("ต้องมีอย่างน้อย 1 หน้ากระดาษครับ");
        return;
      }
      if (confirm(`ต้องการลบหน้าที่ ${pIdx + 1} ใช่หรือไม่?`)) {
        pagesData.splice(pIdx, 1);
        renderAllPages();
      }
    }

    // ย่อและแปลงรูปภาพเป็น Base64 เพื่อให้ไฟล์ไม่หนักเกินไปตอน Export PDF/Word
    function fileToResizedDataURL(file, maxWidth = 1000) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // อัปโหลดรูปเดี่ยวลงช่องที่เลือก
    function triggerSingleImageUpload(pIdx, cIdx) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        if (e.target.files && e.target.files[0]) {
          const dataUrl = await fileToResizedDataURL(e.target.files[0]);
          pagesData[pIdx].cells[cIdx].image = dataUrl;
          renderAllPages();
        }
      };
      input.click();
    }

    function clearCellImage(pIdx, cIdx) {
      pagesData[pIdx].cells[cIdx].image = null;
      renderAllPages();
    }

    // อัปโหลดหลายรูปพร้อมกัน (เรียงลงช่องว่างในหน้านั้น ถ้าเต็มจะไหลไปหน้าถัดไปให้อัตโนมัติ)
    async function handleMultiUpload(event, startPageIdx) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      let pIdx = startPageIdx;
      let cIdx = 0;

      for (const file of files) {
        const dataUrl = await fileToResizedDataURL(file);

        // หาช่องว่างถัดไป
        let placed = false;
        while (pIdx < pagesData.length) {
          const page = pagesData[pIdx];
          while (cIdx < page.gridCount) {
            if (!page.cells[cIdx].image) {
              page.cells[cIdx].image = dataUrl;
              placed = true;
              cIdx++;
              break;
            }
            cIdx++;
          }
          if (placed) break;
          pIdx++;
          cIdx = 0;
        }

        // ถ้าทุกหน้าเต็มหมดแล้ว ให้สร้างหน้าใหม่อัตโนมัติเพื่อใส่รูปที่เหลือ
        if (!placed) {
          addNewPage();
          pIdx = pagesData.length - 1;
          pagesData[pIdx].cells[0].image = dataUrl;
          cIdx = 1;
        }
      }

      renderAllPages();
    }

    // ================= ระบบกล้องถ่ายรูปและสลับกล้อง =================
    async function openCameraModal(pIdx, cIdx) {
      cameraTarget = { pageIndex: pIdx, cellIndex: cIdx };
      const modal = document.getElementById('cameraModal');
      const info = document.getElementById('cameraTargetInfo');

      if (pIdx !== null && cIdx !== null) {
        info.innerText = `กำลังถ่ายใส่: หน้าที่ ${pIdx + 1} ช่องที่ ${cIdx + 1}`;
      } else {
        info.innerText = `โหมดถ่ายต่อเนื่อง: รูปจะถูกใส่ในช่องว่างถัดไปอัตโนมัติ`;
      }

      modal.classList.add('active');
      await startCameraStream();
    }

    async function startCameraStream() {
      stopCameraStream();
      const video = document.getElementById('cameraStream');
      try {
        currentCameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode },
          audio: false
        });
        video.srcObject = currentCameraStream;
      } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์การใช้งานกล้อง หรือเปิดผ่าน HTTPS / localhost ครับ");
      }
    }

    function stopCameraStream() {
      if (currentCameraStream) {
        currentCameraStream.getTracks().forEach(track => track.stop());
        currentCameraStream = null;
      }
    }

    async function switchCameraFacing() {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      await startCameraStream();
    }

    function capturePhotoFromCamera() {
      const video = document.getElementById('cameraStream');
      if (!video.srcObject) return;

      const canvas = document.getElementById('cameraCanvas');
      canvas.width = video.videoWidth || 800;
      canvas.height = video.videoHeight || 600;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

      if (cameraTarget.pageIndex !== null && cameraTarget.cellIndex !== null) {
        pagesData[cameraTarget.pageIndex].cells[cameraTarget.cellIndex].image = dataUrl;
        renderAllPages();
        closeCameraModal();
      } else {
        // ใส่ในช่องว่างแรกที่พบ
        let placed = false;
        for (let p = 0; p < pagesData.length; p++) {
          for (let c = 0; c < pagesData[p].gridCount; c++) {
            if (!pagesData[p].cells[c].image) {
              pagesData[p].cells[c].image = dataUrl;
              placed = true;
              break;
            }
          }
          if (placed) break;
        }
        if (!placed) {
          addNewPage();
          pagesData[pagesData.length - 1].cells[0].image = dataUrl;
        }
        renderAllPages();
        alert("บันทึกรูปลงในช่องว่างเรียบร้อย! สามารถกดถ่ายรูปถัดไปได้เลย");
      }
    }

    function closeCameraModal() {
      stopCameraStream();
      document.getElementById('cameraModal').classList.remove('active');
    }

    // ================= ระบบเปิดงาน / บันทึกเข้าโฟลเดอร์ / ปิดงาน / PDF / WORD =================
    function getProjectPayload() {
      return {
        machineCode: document.getElementById('globalMachineCode').value,
        jobDate: document.getElementById('globalJobDate').value,
        savedAt: new Date().toISOString(),
        pagesData: pagesData
      };
    }

    // บันทึกไฟล์โปรเจกต์เข้าโฟลเดอร์ (รองรับ File System Access API)
    async function saveJobToFolder() {
      const payload = JSON.stringify(getProjectPayload(), null, 2);
      const machine = document.getElementById('globalMachineCode').value || 'Report';
      const dateStr = document.getElementById('globalJobDate').value || 'Date';
      const defaultFileName = `Job_${machine}_${dateStr}.json`;

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: defaultFileName,
            types: [{
              description: 'Maintenance Job File (.json)',
              accept: { 'application/json': ['.json'] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(payload);
          await writable.close();
          alert("บันทึกไฟล์งานเข้าโฟลเดอร์เรียบร้อยแล้วครับ!");
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // Fallback สำหรับเบราว์เซอร์ทั่วไป
      const blob = new Blob([payload], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = defaultFileName;
      a.click();
    }

    function openJobFile() {
      document.getElementById('openJobInput').click();
    }

    function handleOpenJobFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.pagesData) {
            document.getElementById('globalMachineCode').value = data.machineCode || '';
            document.getElementById('globalJobDate').value = data.jobDate || '';
            pagesData = data.pagesData;
            document.getElementById('jobStatusBadge').innerText = "กำลังเปิดงาน";
            document.getElementById('jobStatusBadge').style.color = "#16a34a";
            renderAllPages();
            alert("เปิดไฟล์งานเรียบร้อยแล้วครับ!");
          }
        } catch (err) {
          alert("ไฟล์งานไม่ถูกต้องครับ");
        }
      };
      reader.readAsText(file);
    }

    // ส่งออกเป็นไฟล์ PDF
    async function exportToPDF() {
      const workspace = document.getElementById('workspace');
      document.body.classList.add('exporting');

      const machine = document.getElementById('globalMachineCode').value || 'Machine';
      const dateStr = document.getElementById('globalJobDate').value || '';
      const firstOrientation = pagesData[0]?.orientation || 'portrait';

      const opt = {
        margin: 0,
        filename: `Maintenance_${machine}_${dateStr}.pdf`,
        image: { type: 'jpeg', quality: 0.92 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: firstOrientation },
        pagebreak: { mode: ['css', 'legacy'] }
      };

      try {
        await html2pdf().set(opt).from(workspace).save();
      } finally {
        document.body.classList.remove('exporting');
      }
    }

    // ส่งออกเป็นไฟล์ Microsoft Word (.doc) พร้อมรูปและตารางครบทุกหน้า
    function exportToWord() {
      const machine = document.getElementById('globalMachineCode').value || '-';
      const jobDate = document.getElementById('globalJobDate').value || '-';

      // แปลงขนาดซม. สำหรับรูปใน Word
      const sizeCmMap = {
        'size-auto': 5.5,
        'size-4x4': 4,
        'size-5x5': 5,
        'size-6x6': 6,
        'size-7x7': 7,
        'size-8x8': 8,
        'size-9x9': 9
      };

      let wordBody = '';

      pagesData.forEach((page, pIdx) => {
        const cm = sizeCmMap[page.frameSize] || 6;
        const pxSize = Math.round(cm * 37.8); // แปลง cm เป็น px สำหรับ Word
        const cols = (page.gridCount === 12) ? 3 : 2;

        wordBody += `
          <div style="page-break-after: always; font-family: 'Sarabun', 'TH SarabunPSK', sans-serif;">
            <h2 style="text-align:center; margin-bottom:4px;">${page.title}</h2>
            <p style="text-align:center; font-weight:bold; margin-top:0;">
              รหัสเครื่องจักร: ${machine} &nbsp;&nbsp;|&nbsp;&nbsp; วันที่เข้าทำ: ${jobDate}
            </p>
        `;

        // ข้อความตรงกลางหน้า
        page.centerNotes.forEach(note => {
          wordBody += `<p style="text-align:center; font-weight:bold; margin:4px 0;">${note}</p>`;
        });

        // ตารางวัดค่าหน้า 6
        if (page.type === 'measurement') {
          wordBody += `
            <table border="1" cellspacing="0" cellpadding="6" style="width:100%; border-collapse:collapse; text-align:center; margin-bottom:10px;">
              <tr style="background:#e2e8f0; font-weight:bold;">
                <td>พารามิเตอร์ที่วัด</td>
                <td>ค่าที่ 1</td>
                <td>ค่าที่ 2</td>
                <td>ค่าที่ 3</td>
              </tr>
              <tr>
                <td><b>Temperature (°C)</b></td>
                <td>${page.measurements.temp[0] || '-'} °C</td>
                <td>${page.measurements.temp[1] || '-'} °C</td>
                <td>${page.measurements.temp[2] || '-'} °C</td>
              </tr>
              <tr>
                <td><b>Vibration (mm/s)</b></td>
                <td>${page.measurements.vib[0] || '-'} mm/s</td>
                <td>${page.measurements.vib[1] || '-'} mm/s</td>
                <td>${page.measurements.vib[2] || '-'} mm/s</td>
              </tr>
            </table>
          `;
        }

        // ข้อเสนอแนะหน้า 7
        if (page.type === 'comment') {
          wordBody += `
            <div style="border:1px solid #333; padding:8px; margin-bottom:10px;">
              <p><b>Alarm Code:</b> ${page.alarmCode || '-'}</p>
              <p><b>Comment / ข้อเสนอแนะ:</b><br>${(page.commentText || '-').replace(/\n/g, '<br>')}</p>
            </div>
          `;
        }

        // แถบก่อนทำ - หลังทำ
        if (page.beforeAfter) {
          wordBody += `
            <table border="1" cellspacing="0" cellpadding="4" style="width:100%; border-collapse:collapse; text-align:center; margin-bottom:8px; background:#f1f5f9; font-weight:bold;">
              <tr>
                <td style="width:50%;">ก่อนทำ (BEFORE)</td>
                <td style="width:50%;">หลังทำ (AFTER)</td>
              </tr>
            </table>
          `;
        }

        // ตารางรูปภาพจัดกึ่งกลาง
        wordBody += `<table border="1" cellspacing="0" cellpadding="8" style="width:100%; border-collapse:collapse; text-align:center;">`;
        for (let i = 0; i < page.gridCount; i++) {
          if (i % cols === 0) wordBody += `<tr>`;
          const cell = page.cells[i];
          wordBody += `<td style="text-align:center; vertical-align:top; width:${Math.floor(100 / cols)}%;">`;
          if (cell.image) {
            wordBody += `<img src="${cell.image}" width="${pxSize}" height="${pxSize}" style="display:block; margin:0 auto;"><br>`;
          } else {
            wordBody += `<div style="height:${pxSize}px; line-height:${pxSize}px; color:#888;">[ไม่มีรูปภาพ]</div>`;
          }
          cell.captions.forEach(cap => {
            wordBody += `<div style="text-align:center; font-size:11pt; margin-top:3px;">${cap}</div>`;
          });
          wordBody += `</td>`;
          if (i % cols === cols - 1 || i === page.gridCount - 1) wordBody += `</tr>`;
        }
        wordBody += `</table></div>`;
      });

      const fullHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Maintenance Report</title></head>
        <body>${wordBody}</body>
        </html>
      `;

      const blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Maintenance_${machine}_${jobDate}.doc`;
      a.click();
    }

    // ปุ่ม บันทึก / ปิดงาน (เลือกบันทึกเป็น PDF, Word หรือ JSON ได้ทันที)
    async function closeJobFlow() {
      const choice = prompt(
        "🔒 ต้องการบันทึกและปิดงานในรูปแบบใด?\nพิมพ์ 1 = บันทึกเป็นทั้ง PDF และ WORD\nพิมพ์ 2 = บันทึกเฉพาะ PDF\nพิมพ์ 3 = บันทึกเฉพาะ WORD\nพิมพ์ 4 = บันทึกไฟล์โปรเจกต์ลงโฟลเดอร์ (.json)",
        "1"
      );
      if (!choice) return;

      if (choice === "1") {
        exportToWord();
        await exportToPDF();
      } else if (choice === "2") {
        await exportToPDF();
      } else if (choice === "3") {
        exportToWord();
      } else if (choice === "4") {
        await saveJobToFolder();
      }

      const badge = document.getElementById('jobStatusBadge');
      badge.innerText = "ปิดงานแล้ว (Closed)";
      badge.style.color = "#dc2626";
    }

    // เริ่มต้นสร้าง 7 หน้ามาตรฐานทันทีที่เปิดเว็บ
    window.onload = initDefaultPages;
  </script>
</body>
</html>
